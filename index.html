<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Công thành chiến</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --ink: rgba(30, 10, 38, .78); --ember: #ff8a3d; --bone: #fff4e0; --gold: #ffcf4a; --dim: #5d4a63; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; color: var(--bone); font-family: 'Baloo 2', 'Segoe UI', system-ui, sans-serif; font-weight: 600; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; top: 1.8vh; left: 50%; transform: translateX(-50%); width: min(88vw, 720px); }
  .meta { display: flex; justify-content: space-between; align-items: baseline; padding: 0 .4em; text-shadow: 0 2px 0 rgba(0,0,0,.55); }
  #lvl { font-weight: 800; font-size: clamp(16px, 2.6vh, 28px); }
  #hud.boss #lvl { color: #ff6b6b; }
  #timer { font-weight: 800; font-size: clamp(18px, 3vh, 32px); font-variant-numeric: tabular-nums; }
  #timer.low { color: #ff6b5e; }

  .bar { position: relative; height: clamp(26px, 4.2vh, 44px); background: var(--ink); border: 3px solid #12061a; border-radius: 999px; overflow: hidden; box-shadow: 0 4px 0 rgba(0,0,0,.45); }
  #hud.boss .bar { border-color: #6b1230; box-shadow: 0 4px 0 rgba(0,0,0,.45), 0 0 18px rgba(255, 60, 90, .55); }
  #pGhost { position: absolute; inset: 0 auto 0 0; background: #f6e7b0; width: 0; }
  #pFill { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(#fff4 0, #0000 45%), linear-gradient(90deg, #ff7a3d, #ffcf4a); }
  #pMark { position: absolute; top: 0; bottom: 0; left: 50%; width: 3px; background: rgba(18, 6, 26, .7); }
  #pText { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: clamp(13px, 2.2vh, 24px); text-shadow: 0 2px 0 rgba(0,0,0,.6); font-variant-numeric: tabular-nums; }

  #stars { display: flex; justify-content: center; gap: 2.4vh; margin-top: .8vh; }
  .st { display: flex; flex-direction: column; align-items: center; line-height: 1; }
  .st svg { width: clamp(30px, 5vh, 54px); height: auto; fill: #3b2643; stroke: #12061a; stroke-width: 1.4; stroke-linejoin: round; }
  .st span { font-size: clamp(10px, 1.6vh, 16px); opacity: .8; margin-top: .2em; text-shadow: 0 1px 0 rgba(0,0,0,.6); }
  .st.on svg { fill: var(--gold); animation: pop .5s cubic-bezier(.2, 1.6, .4, 1); filter: drop-shadow(0 0 8px rgba(255, 190, 60, .8)); }
  .st.on span { opacity: 1; color: var(--gold); }
  @keyframes pop { 0% { transform: scale(.3) rotate(-30deg); } 100% { transform: scale(1) rotate(0); } }

  #top { display: flex; justify-content: center; gap: .8vh; margin-top: .8vh; flex-wrap: wrap; }
  .chip { background: var(--ink); border-radius: 999px; padding: .1em .8em .1em .3em; display: flex; align-items: center; gap: .45em; font-size: clamp(12px, 1.9vh, 20px); max-width: 30vw; }
  .chip img, .chip i, .ev img, .ev i { border-radius: 50%; object-fit: cover; background: var(--dim); flex: none; }
  .chip img, .chip i { width: 1.9em; height: 1.9em; }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip b { color: var(--ember); font-weight: 800; }

  #badges { display: flex; justify-content: center; gap: .8vh; margin-top: .8vh; flex-wrap: wrap; }
  .badge { position: relative; overflow: hidden; border-radius: 12px; padding: .05em .8em; background: var(--ink); font-weight: 800; font-size: clamp(12px, 1.9vh, 21px); border: 2px solid var(--c); text-shadow: 0 2px 0 rgba(0,0,0,.5); }
  .badge[hidden] { display: none; }
  .badge i { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--c); transition: width .2s linear; }
  #combo { --c: var(--ember); }
  #rage { --c: #b56cff; color: #e6ceff; }
  #freeze { --c: #a8e6ff; color: #d8f4ff; }
  #enrage { --c: #ff4a5e; color: #ffb0b8; }
  #mod { --c: #ffcf4a; font-weight: 600; }

  /* ---------- Feed ---------- */
  #feed { position: fixed; left: 2.5vw; bottom: 20vh; width: min(66vw, 460px); display: flex; flex-direction: column; gap: .7vh; }
  .ev { display: flex; align-items: center; gap: .6em; background: var(--ink); border-left: 5px solid var(--c, var(--ember)); border-radius: 10px; padding: .25em .7em .25em .3em; font-size: clamp(13px, 2.1vh, 22px); animation: slide .3s ease-out; }
  .ev.out { opacity: 0; transition: opacity .5s; }
  .ev img, .ev i { width: 2.1em; height: 2.1em; }
  .ev .t { min-width: 0; line-height: 1.15; }
  .ev .t div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev .t div + div { opacity: .85; font-size: .9em; }
  .ev .d { margin-left: auto; font-weight: 800; color: var(--ember); font-variant-numeric: tabular-nums; }
  .ev.kill { background: rgba(70, 14, 20, .82); padding-left: .7em; }
  .ev.kill .t div:first-child { font-weight: 800; }
  @keyframes slide { from { transform: translateX(-30px); opacity: 0; } to { transform: none; opacity: 1; } }

  #banner { position: fixed; left: 0; right: 0; top: 30vh; text-align: center; pointer-events: none; font-weight: 800; font-size: clamp(34px, 9vh, 100px); letter-spacing: .02em; text-shadow: 0 5px 0 rgba(0,0,0,.6), 0 0 30px rgba(255, 120, 40, .6); opacity: 0; }
  #banner.boss { color: #ff5a6a; text-shadow: 0 5px 0 rgba(0,0,0,.7), 0 0 36px rgba(255, 40, 80, .8); }
  #banner.show { animation: banner 2.4s ease-out; }
  @keyframes banner { 0% { opacity: 0; transform: scale(2.2); } 14% { opacity: 1; transform: scale(1); } 78% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(.96); } }

  /* ---------- Kết quả ---------- */
  #result { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; background: rgba(24, 6, 32, .6); animation: fade .4s ease-out; }
  #result[hidden] { display: none; }
  #result h1 { margin: 0; font-size: clamp(30px, 7vh, 72px); font-weight: 800; text-shadow: 0 4px 0 rgba(0,0,0,.55); }
  #result h2 { margin: 1.6vh 0 .8vh; font-size: clamp(14px, 2.4vh, 24px); font-weight: 800; color: var(--gold); }
  #result .sub { font-size: clamp(14px, 2.4vh, 24px); opacity: .92; }
  #result .rs { display: flex; justify-content: center; gap: 1.6vh; margin: 1vh 0 1vh; }
  #result .rs .st svg { width: clamp(46px, 9vh, 96px); }
  #result ol { list-style: none; margin: 0 auto; padding: 0; width: min(80vw, 440px); font-size: clamp(15px, 2.6vh, 26px); }
  #result li { display: flex; justify-content: space-between; gap: 1em; padding: .1em .6em; background: var(--ink); border-radius: 10px; margin-bottom: .6vh; }
  #result li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #result li b { color: var(--ember); white-space: nowrap; }
  #result p { margin: 1.4vh 0 0; font-size: clamp(14px, 2.4vh, 24px); opacity: .9; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- HUD chế độ đội ---------- */
  #hudT { position: fixed; top: 1.8vh; left: 50%; transform: translateX(-50%); width: min(94vw, 780px); }
  #hudT[hidden], #hud[hidden] { display: none; }
  #hudT .meta { padding: 0 .4em; }
  #tScore { font-weight: 800; font-size: clamp(13px, 2.1vh, 22px); }
  .tbars { display: flex; gap: .9vh; }
  .tb { position: relative; flex: 1; height: clamp(26px, 4vh, 42px); background: var(--ink); border: 3px solid #12061a; border-radius: 999px; overflow: hidden; box-shadow: 0 4px 0 rgba(0,0,0,.45); }
  .tb .f { position: absolute; top: 0; bottom: 0; width: 0; }
  .tb.blue .f { left: 0; background: linear-gradient(#fff4 0, #0000 45%), linear-gradient(90deg, #2a6fe0, #63b6ff); }
  .tb.red .f { right: 0; background: linear-gradient(#fff4 0, #0000 45%), linear-gradient(270deg, #e03a3a, #ff8a70); }
  .tb span { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: clamp(13px, 2.1vh, 23px); text-shadow: 0 2px 0 rgba(0,0,0,.6); font-variant-numeric: tabular-nums; }
  .trow { display: flex; gap: .9vh; margin-top: .6vh; }
  .trow > div { flex: 1; display: flex; flex-wrap: wrap; gap: .6vh; align-items: center; min-width: 0; }
  .trow > div.r { justify-content: flex-end; }
  .tstars .st svg { width: clamp(22px, 3.6vh, 38px); }
  .tstars .st span { display: none; }
  .tcount { font-size: clamp(12px, 1.8vh, 19px); font-weight: 800; text-shadow: 0 2px 0 rgba(0,0,0,.6); }
  #tPhase { text-align: center; font-weight: 800; font-size: clamp(12px, 1.9vh, 20px); margin: -.2vh 0 .6vh; text-shadow: 0 2px 0 rgba(0,0,0,.6); }
  #tHint { text-align: center; margin-top: .8vh; font-size: clamp(11px, 1.7vh, 18px); opacity: .9; text-shadow: 0 2px 0 rgba(0,0,0,.6); }
  #banner.tblue { color: #7cc4ff; }
  #banner.tred { color: #ff8a80; }
  #rTeams { display: flex; gap: 2vh; justify-content: center; margin-top: 1vh; }
  #rTeams[hidden], #rSolo[hidden] { display: none; }
  .tcolr { flex: 1; max-width: 46vw; min-width: 0; border-top: 6px solid var(--c); background: rgba(30, 10, 38, .6); border-radius: 12px; padding: .6vh 1vh 1vh; }
  .tcolr.win { box-shadow: 0 0 24px var(--c); }
  .tcolr h3 { margin: 0; color: var(--c); font-size: clamp(18px, 3.2vh, 34px); }
  .tcolr .rs { margin: .4vh 0 !important; }
  .tcolr .rs .st svg { width: clamp(30px, 6vh, 64px); }
  .tcolr .rs .st span { display: none; }
  .tpct { font-weight: 800; font-size: clamp(20px, 4vh, 44px); }
  .tcolr ol { width: auto !important; font-size: clamp(12px, 2vh, 20px) !important; }

  #feed.team { bottom: 11vh; }
  #conn { position: fixed; left: 8px; bottom: 8px; padding: .2em .8em; border-radius: 8px; background: rgba(120, 20, 30, .85); font-size: 13px; }
  #conn[hidden] { display: none; }
  /* ---------- Khung dọc 9:16 (live điện thoại): chữ theo vw, tránh vùng giao diện TikTok ---------- */
  @media (max-aspect-ratio: 124/100) {
    #hud, #hudT { top: var(--safeTop, 9vh); width: min(94vw, 900px); }
    .meta { line-height: 1.15; }
    #lvl { font-size: 4.2vw; } #timer { font-size: 5.2vw; } #tScore { font-size: 3.6vw; }
    .bar { height: 7vw; } #pText { font-size: 3.8vw; }
    .st svg { width: 8vw; } .st span { font-size: 2.5vw; }
    .tb { height: 6.6vw; } .tb span { font-size: 3.4vw; }
    .tstars .st svg { width: 5.2vw; }
    .tcount { font-size: 3.1vw; } #tPhase { font-size: 3.1vw; } #tHint { font-size: 2.7vw; }
    .chip { font-size: 3.2vw; max-width: 44vw; } .badge { font-size: 3vw; }
    #feed, #feed.team { left: 2.5vw; width: 66vw; bottom: calc(var(--safeBottom, 16vh) + 1vh); }
    .ev { font-size: 3.3vw; }
    #banner { font-size: 11vw; top: 38vh; }
    #result h1 { font-size: 9vw; } #result h2 { font-size: 4vw; } #result .sub { font-size: 3.6vw; } #result p { font-size: 3.4vw; }
    #result ol { font-size: 3.6vw; width: 88vw; }
    #result .rs .st svg { width: 12vw; }
    .tcolr h3 { font-size: 4vw; } .tpct { font-size: 7vw; } .tcolr ol { font-size: 3vw !important; } .tcolr .rs .st svg { width: 8vw; }
    #conn { font-size: 3vw; }
  }
  @media (min-aspect-ratio: 5/4) {
    #hud, #hudT { left: 2vw; transform: none; width: min(32vw, 560px); top: 2vh; }
    #feed, #feed.team { left: auto; right: 2.5vw; bottom: 5vh; width: min(30vw, 440px); }
  }
  @media (prefers-reduced-motion: reduce) { .ev, .st.on svg, #result, #banner.show { animation: none; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
  <div class="meta"><span id="lvl">Cấp 1</span><span id="timer">3:00</span></div>
  <div class="bar"><div id="pGhost"></div><div id="pFill"></div><div id="pMark"></div><div id="pText">Phá hủy 0%</div></div>
  <div id="stars"></div>
  <div id="top"></div>
  <div id="badges">
    <div class="badge" id="mod" hidden><span></span></div>
    <div class="badge" id="enrage" hidden><span>Boss nổi điên: phòng thủ +40%</span></div>
    <div class="badge" id="combo" hidden><span></span><i></i></div>
    <div class="badge" id="rage" hidden><span></span><i></i></div>
    <div class="badge" id="freeze" hidden><span></span><i></i></div>
  </div>
</div>

<div id="hudT" hidden>
  <div class="meta"><span id="tScore"></span><span id="tTimer">4:00</span></div>
  <div id="tPhase"></div>
  <div class="tbars">
    <div class="tb blue"><div class="f" id="tfBlue"></div><span id="tpBlue"></span></div>
    <div class="tb red"><div class="f" id="tfRed"></div><span id="tpRed"></span></div>
  </div>
  <div class="trow"><div class="tstars" id="tsBlue"></div><div class="tstars r" id="tsRed"></div></div>
  <div class="trow"><div class="tcount" id="tcBlue"></div><div class="tcount r" id="tcRed"></div></div>
  <div class="trow"><div id="ttBlue"></div><div class="r" id="ttRed"></div></div>
  <div class="trow"><div id="tbBlue"></div><div class="r" id="tbRed"></div></div>
  <div id="tHint"></div>
</div>

<div id="feed"></div>
<div id="banner"></div>

<div id="result" hidden>
  <div>
    <h1 id="rTitle"></h1>
    <div id="rSolo">
      <div class="rs" id="rStars"></div>
      <div class="sub" id="rSub"></div>
      <h2>Sát thương cao nhất</h2>
      <ol id="rTop"></ol>
    </div>
    <div class="sub" id="rSubT"></div>
    <div id="rTeams" hidden></div>
    <div id="rAllBox" hidden><h2>Kỷ lục mọi thời đại</h2><ol id="rAll"></ol></div>
    <p id="rScore"></p>
    <p id="rNext"></p>
  </div>
</div>
<div id="conn" hidden>Mất kết nối server, đang thử lại...</div>

<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
  /* ================== Tiện ích ================== */
  const $ = (id) => document.getElementById(id);
  // Vùng an toàn trên khung dọc (% chiều cao) để tránh thanh trên và ô chat/nhập của TikTok. Chỉnh bằng ?safeTop=9&safeBottom=16
  const qp = (name, def) => { const m = new RegExp('[?&]' + name + '=([0-9.]+)').exec(location.search); return m ? parseFloat(m[1]) : def; };
  const SAFE_TOP = qp('safeTop', 9), SAFE_BOTTOM = qp('safeBottom', 16);
  if (document.documentElement) { document.documentElement.style.setProperty('--safeTop', SAFE_TOP + 'vh'); document.documentElement.style.setProperty('--safeBottom', SAFE_BOTTOM + 'vh'); }
  // Xem thử trên trình duyệt: thêm ?bg=1 (nền tối) hoặc ?bg=green (nền xanh lá). Trong OBS để nguyên: nền trong suốt.
  { const m = /[?&]bg=(\w+)/.exec(location.search); if (m && document.body) document.body.style.background = m[1] === 'green' ? '#0a7a3a' : 'linear-gradient(160deg,#1c1626,#2b2140 60%,#3a2a4f)'; }
  const STAR = '<svg viewBox="0 0 24 24"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.9L12 17.8 5.8 21.1 7 14.2 2 9.3l6.9-1z"/></svg>';
  const STAR_CAP = ['50%', 'Nhà Chính', '100%'];
  const rand = (a, b) => a + Math.random() * (b - a);
  const fmt = (n) => Math.max(0, Math.round(n)).toLocaleString('vi-VN');
  const safeImg = (u) => (typeof u === 'string' && /^https:\/\//.test(u) ? u : '');

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text; // textContent: tên khán giả không thể chèn HTML
    return e;
  }
  function avatar(url) {
    const src = safeImg(url);
    if (!src) return el('i');
    const im = new Image(); im.src = src; im.referrerPolicy = 'no-referrer';
    im.onerror = () => im.replaceWith(el('i'));
    return im;
  }
  function starBox(cls) { // 3 ngôi sao kèm chú thích điều kiện
    const box = [];
    for (let i = 0; i < 3; i++) {
      const d = el('div', 'st'); d.insertAdjacentHTML('beforeend', STAR); d.append(el('span', '', STAR_CAP[i]));
      box.push(d);
    }
    return box;
  }
  const hudStars = starBox(); hudStars.forEach((d) => $('stars').append(d));
  const hudStarsT = { blue: starBox(), red: starBox() };
  hudStarsT.blue.forEach((d) => $('tsBlue').append(d)); hudStarsT.red.forEach((d) => $('tsRed').append(d));
  function mkBadge(color) { const d = el('div', 'badge'); d.style.setProperty('--c', color); d.style.color = color; d.hidden = true; d.append(el('span'), el('i')); return d; }
  const tBadge = {};
  for (const t of ['blue', 'red']) {
    tBadge[t] = { combo: mkBadge('#ff8a3d'), rage: mkBadge('#d9b3ff'), fz: mkBadge('#a8e6ff') };
    Object.values(tBadge[t]).forEach((b) => $(t === 'blue' ? 'tbBlue' : 'tbRed').append(b));
  }

  /* ================== Âm thanh (WebAudio, không cần file) ================== */
  // OBS: tick "Control audio via OBS" ở Browser Source. Tắt tiếng: ?mute=1 hoặc phím M.
  const sfx = (() => {
    let ac = null, master = null, muted = /[?&]mute=1/.test(location.search); const last = {};
    function A() {
      if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = .55; master.connect(ac.destination); } catch (_) { return null; } }
      if (ac.state === 'suspended') ac.resume().catch(() => {});
      return ac;
    }
    const gate = (k, ms) => { const n = performance.now(); if (n - (last[k] || 0) < ms) return false; last[k] = n; return true; };
    function tone(f, dur, o = {}) {
      if (muted) return; const a = A(); if (!a) return;
      const t = a.currentTime + (o.delay || 0), osc = a.createOscillator(), g = a.createGain();
      osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t);
      if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, f + o.slide), t + dur);
      g.gain.setValueAtTime(o.vol || .2, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
      osc.connect(g).connect(master); osc.start(t); osc.stop(t + dur + .03);
    }
    function noise(dur, vol, lp, delay = 0) {
      if (muted) return; const a = A(); if (!a) return;
      const t = a.currentTime + delay, n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
      src.buffer = buf; f.type = 'lowpass'; f.frequency.value = lp; g.gain.value = vol;
      src.connect(f).connect(g).connect(master); src.start(t);
    }
    return {
      unlock: A, toggle() { muted = !muted; },
      hit() { if (gate('hit', 90)) { tone(150, .12, { type: 'triangle', vol: .16, slide: -90 }); noise(.08, .07, 900); } },
      spawn(look) { if (look === 'dragon') { tone(90, .7, { type: 'sawtooth', vol: .16, slide: 140 }); tone(60, .7, { type: 'square', vol: .08, slide: 60 }); } else if (gate('spawn', 60)) tone(420, .09, { type: 'square', vol: .06, slide: 220 }); },
      shoot() { if (gate('shoot', 120)) { tone(120, .16, { type: 'sawtooth', vol: .09, slide: -70 }); noise(.12, .09, 1600); } },
      boom() { if (gate('boom', 80)) { noise(.55, .32, 700); tone(80, .5, { type: 'sine', vol: .28, slide: -50 }); } },
      star() { [660, 880, 1320].forEach((f, i) => tone(f, .28, { type: 'triangle', vol: .16, delay: i * .08 })); },
      win() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, .3, { type: 'triangle', vol: .17, delay: i * .12 })); },
      lose() { [392, 330, 262].forEach((f, i) => tone(f, .36, { type: 'sine', vol: .18, delay: i * .18 })); },
      lightning() { noise(.45, .35, 5000); tone(1400, .35, { type: 'sawtooth', vol: .12, slide: -1200 }); },
      rage() { tone(180, .8, { type: 'sawtooth', vol: .14, slide: 500 }); tone(90, .8, { type: 'square', vol: .08, slide: 200 }); },
      freeze() { tone(1800, .7, { type: 'sine', vol: .12, slide: -1200 }); tone(2400, .5, { type: 'triangle', vol: .06, slide: -1600, delay: .05 }); },
      heal() { [523, 659, 784].forEach((f, i) => tone(f, .35, { type: 'sine', vol: .12, delay: i * .1 })); },

  /* ================== Hiệu ứng ================== */

  function unitAttackFx(u, b) {

  function unitFightFx(u, e) {

    else if (look === 'dragon') bolts.push({ x1: PX(u.x), y1: PY(u.y) - k * 3, x2: ex, y2: ey - 8, life: .1, color: u.cfg.color, w: 4, jag: true });

  function updateFx(dt, t) {
    for (const b of bmap.values()) {

      if (b.healT > 0) b.healT = Math.max(0, b.healT - dt);

      if (b.accT <= 0 && b.acc >= 1) { floaters.push({ x: PX(b.x), y: PY(b.y) - b.radius * k * 1.3, text: '-' + fmt(b.acc), life: 1, big: b.acc > 300 }); b.acc = 0; b.accT = .45; }
      if (!b.dead && b.maxHp && b.hp / b.maxHp < .5) { b.smokeT -= dt; if (b.smokeT <= 0) { b.smokeT = .18; particles.push({ x: PX(b.x) + rand(-4, 4), y: PY(b.y) - b.radius * k * .5, vx: rand(-8, 8), vy: -rand(30, 60), life: 1.1, color: 'rgba(60,50,60,.5)', size: b.radius * k * .28, smoke: true }); } }

      }

      if (p.kind === 'rocket') particles.push({ x: PX(p.x), y: PY(p.y), vx: rand(-10, 10), vy: rand(-10, 10), life: .4, color: 'rgba(230,230,230,.6)', size: k * .5, smoke: true });
      if (q >= 1) {
        const px = PX(p.tx), py = PY(p.ty) - (p.tb ? 0 : 10);
        if (p.kind === 'shell') { rings.push({ x: px, y: py + 10, r0: 4, r1: k * 5, life: .3, max: .3, color: '#ffb347' }); chips(px, py, 8, ['#ffd27a', '#ff8a3d', '#555']); }
        else chips(px, py, 4, ['#ffd27a', '#ddd']);
        projectiles.splice(i, 1);
      }

    if (shake > 0) shake = Math.max(0, shake - dt * 30);

  function jagged(x1, y1, x2, y2, seg, amp) {

    ctx.lineTo(x2, y2); ctx.stroke();
  }

  function drawFx(dt, t) {
    for (const p of projectiles) {
      const x = PX(p.x), y = PY(p.y) - (p.kind === 'arrow' ? 8 : 6), a = Math.atan2(PY(p.ty) - PY(p.fy), PX(p.tx) - PX(p.fx));
      if (p.kind === 'arrow') { ctx.strokeStyle = '#efe6c8'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x - Math.cos(a) * 9, y - Math.sin(a) * 9); ctx.lineTo(x, y); ctx.stroke(); }

    }
    for (let i = rings.length - 1; i >= 0; i--) {

      const q = 1 - r.life / r.max; ctx.globalAlpha = r.life / r.max; ctx.strokeStyle = r.color; ctx.lineWidth = 5; circle(r.x, r.y, r.r0 + (r.r1 - r.r0) * q); ctx.stroke(); ctx.globalAlpha = 1;

  const KEYS = { 1: 'archer', 2: 'barbarian', 3: 'hogRider', 4: 'giant', 5: 'balloon', 6: 'electroDragon', 7: 'lightning', 8: 'freeze', 9: 'heal', 0: 'rage' };
  const SHIFT_DIGITS = { '!': '1', '@': '2', '#': '3', '$': '4', '%': '5', '^': '6', '&': '7', '*': '8', '(': '9', ')': '0' };
  window.addEventListener('keydown', (e) => {
    sfx.unlock();
    if (e.key === 'm' || e.key === 'M') { sfx.toggle(); return; }
    const key = KEYS[e.key] ? e.key : SHIFT_DIGITS[e.key]; if (!key) return;
    const team = mode === 'team' ? (e.shiftKey ? 'red' : 'blue') : 'atk';
    const count = mode === 'team' ? (e.altKey ? 5 : 1) : (e.shiftKey ? 5 : 1);
    fetch('/sim?key=' + KEYS[key] + '&count=' + count + '&team=' + team).catch(() => {});
  });
})();
</script>
</body>
