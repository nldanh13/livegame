<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Công thành chiến</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fff4e0; --gold: #ffcf4a; --ember: #ff8a3d; --rim: #f0b64a; --rim-d: #9a5f14;
    --blue: #3fa0ff; --red: #ff5252; --dim: #5d4a63;
    --p1: #40295a; --p2: #24153a; --deep: #12081c;
    --outs: 0 1px 0 #14081e, 1px 0 0 #14081e, -1px 0 0 #14081e, 0 -1px 0 #14081e;
    --out: 0 2px 0 #14081e, 2px 0 0 #14081e, -2px 0 0 #14081e, 0 -2px 0 #14081e, 2px 2px 0 #14081e, -2px 2px 0 #14081e, 2px -2px 0 #14081e, -2px -2px 0 #14081e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; color: var(--cream); font-family: 'Baloo 2', 'Segoe UI', system-ui, sans-serif; font-weight: 600; line-height: 1.15; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  [hidden] { display: none !important; }
  .txt { text-shadow: var(--out); }

  /* ---------- khung panel kiểu game ---------- */
  .panel { background: linear-gradient(var(--p1), var(--p2)); border: 3px solid var(--deep); border-radius: 14px;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.16), inset 0 -3px 0 rgba(0,0,0,.35), 0 4px 0 rgba(0,0,0,.4); }
  .rim { box-shadow: inset 0 2px 0 rgba(255,255,255,.16), 0 0 0 3px var(--rim), 0 0 0 5px var(--deep), 0 6px 0 5px rgba(0,0,0,.35); }

  /* ---------- HUD solo ---------- */
  #hud { position: fixed; top: 1.2vh; left: 50%; transform: translateX(-50%); width: min(92vw, 560px);
    padding: .35vh .65vh .4vh; border-radius: 14px;
    background: linear-gradient(180deg, rgba(34, 18, 54, 0.82), rgba(18, 9, 30, 0.9));
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1.5px solid rgba(255, 207, 74, 0.32);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.52), inset 0 1px 0 rgba(255, 255, 255, 0.14); }
  .meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: .3vh; }
  #lvl { font-weight: 800; font-size: clamp(12px, 1.7vh, 20px); padding: .04em .65em; border-radius: 8px; background: linear-gradient(135deg, rgba(106, 63, 160, 0.82), rgba(67, 39, 110, 0.88)); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border: 1.5px solid var(--rim); box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 2px 0 rgba(0,0,0,.4); text-shadow: var(--out); }
  #hud.boss #lvl { background: linear-gradient(#c23a4a, #7c1826); }
  #timer, #tTimer { font-weight: 800; font-size: clamp(13px, 2vh, 22px); font-variant-numeric: tabular-nums; padding: .02em .65em; border-radius: 999px; background: linear-gradient(135deg, rgba(43, 26, 66, 0.82), rgba(23, 12, 40, 0.88)); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border: 1.5px solid var(--rim); box-shadow: 0 2px 0 rgba(0,0,0,.35); text-shadow: var(--out); }
  #timer.low, #tTimer.low { color: #ff6b5e; animation: throb .5s infinite alternate; }
  #tTimer.gold { color: var(--gold); box-shadow: 0 0 0 2px var(--deep), 0 0 14px 3px rgba(255, 200, 60, .75); }
  @keyframes throb { to { transform: scale(1.08); } }

  .bar { position: relative; height: clamp(18px, 2.6vh, 28px); background: linear-gradient(135deg, rgba(21, 10, 34, 0.9), rgba(42, 23, 64, 0.9)); border: 2px solid var(--deep); border-radius: 999px; overflow: hidden;
    box-shadow: 0 0 0 2px var(--rim), 0 0 0 3px var(--deep), 0 4px 0 3px rgba(0,0,0,.35); }
  #hud.boss .bar { box-shadow: 0 0 0 2px #ff6b7a, 0 0 0 4px var(--deep), 0 0 18px 3px rgba(255, 60, 90, .6); }
  #pGhost { position: absolute; inset: 0 auto 0 0; background: #f6e7b0; width: 0; opacity: .55; }
  .fill { position: absolute; top: 0; bottom: 0; width: 0; overflow: hidden; }
  .fill::before { content: ''; position: absolute; inset: 0; background: linear-gradient(rgba(255,255,255,.45), rgba(255,255,255,0) 55%); }
  .fill::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, rgba(255,255,255,.16) 0 10px, transparent 10px 24px); animation: stripes 1.1s linear infinite; }
  @keyframes stripes { to { background-position: 24px 0; } }
  #pFill { left: 0; background: linear-gradient(90deg, #ff7a3d, #ffcf4a); }
  #pMark { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: rgba(18, 8, 28, .75); z-index: 2; }
  #pText, .barText { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: clamp(11px, 1.6vh, 17px); text-shadow: var(--out); font-variant-numeric: tabular-nums; z-index: 3; }

  #stars { display: flex; justify-content: center; gap: 1.4vh; margin-top: .4vh; }
  .st { display: flex; flex-direction: column; align-items: center; line-height: 1; }
  .st svg { width: clamp(20px, 3vh, 36px); height: auto; overflow: visible; filter: drop-shadow(0 2px 0 rgba(0,0,0,.45)); }
  .st svg path { fill: url(#gStarOff); stroke: #12081c; stroke-width: 1.4; stroke-linejoin: round; }
  .st span { font-size: clamp(9px, 1.2vh, 13px); opacity: .85; margin-top: .15em; text-shadow: var(--outs); }
  .st.on svg { animation: pop .5s cubic-bezier(.2, 1.6, .4, 1); filter: drop-shadow(0 0 8px rgba(255, 190, 60, .9)) drop-shadow(0 2px 0 rgba(0,0,0,.4)); }
  .st.on svg path { fill: url(#gStar); }
  .st.on span { opacity: 1; color: var(--gold); }
  @keyframes pop { 0% { transform: scale(.3) rotate(-30deg); } 100% { transform: scale(1) rotate(0); } }

  #top { display: flex; justify-content: center; gap: .5vh; margin-top: .4vh; flex-wrap: wrap; }
  .chip { display: flex; align-items: center; gap: .35em; font-size: clamp(10px, 1.4vh, 15px); max-width: 28vw; padding: .06em .6em .06em .25em; border-radius: 999px;
    background: linear-gradient(135deg, rgba(61, 42, 85, 0.8), rgba(36, 21, 55, 0.86)); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1.5px solid rgba(255,255,255,.16); box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 4px 12px rgba(0,0,0,.35); }
  .chip img, .chip i, .ev img, .ev i { border-radius: 50%; object-fit: cover; background: var(--dim); flex: none; border: 1.5px solid var(--c, #fff4e0); }
  .chip img, .chip i { width: 1.5em; height: 1.5em; }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip b { color: var(--ember); font-weight: 800; }
  .chip.bounty { border-color: #ff4a5e; box-shadow: 0 0 10px rgba(255, 60, 80, .75), 0 4px 12px rgba(0,0,0,.35); }
  .chip.lead { border-color: var(--gold); box-shadow: 0 0 12px rgba(255, 207, 74, .85), 0 4px 12px rgba(0,0,0,.35); }
  .chip.lead b { color: var(--gold); }

  #badges { display: flex; justify-content: center; gap: .5vh; margin-top: .35vh; flex-wrap: wrap; }
  .badge { position: relative; overflow: hidden; border-radius: 8px; padding: .03em .6em; font-weight: 800; font-size: clamp(10px, 1.4vh, 15px);
    background: linear-gradient(135deg, rgba(46, 29, 69, 0.8), rgba(26, 14, 43, 0.86)); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1.5px solid var(--c); box-shadow: 0 4px 12px rgba(0,0,0,.35); text-shadow: var(--outs); }
  .badge i { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--c); transition: width .2s linear; }
  #combo { --c: var(--ember); } #rage { --c: #b56cff; color: #e6ceff; } #freeze { --c: #a8e6ff; color: #d8f4ff; } #enrage { --c: #ff4a5e; color: #ffb0b8; } #rush { --c: #ff8a3d; color: #ffd9b0; } #mod { --c: #ffcf4a; font-weight: 600; }

  /* ---------- Feed thẻ nổi với nền mờ ---------- */
  #feed { position: fixed; left: 2.5vw; bottom: calc(var(--safeBottom, 16vh) + 5.5vh); width: min(42vw, 220px); display: flex; flex-direction: column; gap: .5vh; z-index: 12; pointer-events: none; }
  .ev { display: flex; align-items: center; gap: .45em; border-left: 4px solid var(--c, var(--ember)); border-radius: 12px; padding: .2em .6em .2em .3em; font-size: clamp(12px, 1.8vh, 18px);
    background: linear-gradient(135deg, rgba(55, 32, 82, 0.8), rgba(26, 12, 42, 0.86)); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-top: 1px solid rgba(255,255,255,.16); border-right: 1px solid rgba(255,255,255,.12); border-bottom: 1px solid rgba(0,0,0,.4);
    box-shadow: 0 6px 18px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.14); animation: slide .3s ease-out; }
  .ev.out { opacity: 0; transition: opacity .5s; }
  .ev img, .ev i { width: 1.8em; height: 1.8em; }
  .ev .t { min-width: 0; line-height: 1.15; }
  .ev .t div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev .t div + div { opacity: .88; font-size: .88em; }
  .ev .d { margin-left: auto; font-weight: 800; color: var(--ember); font-variant-numeric: tabular-nums; }
  .ev.kill { background: linear-gradient(135deg, rgba(105, 20, 32, 0.82), rgba(46, 10, 22, 0.88)); border-top-color: rgba(255, 120, 140, 0.25); padding-left: .6em; }
  .ev.kill .t div:first-child { font-weight: 800; }
  .ev.big { background: linear-gradient(135deg, rgba(140, 92, 18, 0.84), rgba(64, 38, 8, 0.9)); border-top-color: rgba(255, 220, 100, 0.35); }
  @keyframes slide { from { transform: translateX(-30px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* ---------- Banner thẻ nổi mờ ---------- */
  #banner { position: fixed; left: 50%; transform: translateX(-50%); top: 23vh; text-align: center; pointer-events: none; font-weight: 800; font-size: clamp(20px, 4.2vh, 48px); letter-spacing: .02em; opacity: 0; line-height: 1.15; white-space: nowrap; max-width: 90vw;
    padding: .22em .85em; border-radius: 999px;
    background: linear-gradient(135deg, rgba(32, 16, 50, 0.86), rgba(16, 7, 26, 0.92)); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 2px solid var(--gold); box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55), 0 0 20px rgba(255, 207, 74, 0.35);
    color: #ffd858; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8), 0 0 12px rgba(255, 207, 74, 0.6); z-index: 25; }
  #banner.boss { border-color: #ff5a6a; color: #ff8a96; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55), 0 0 22px rgba(255, 60, 90, 0.45); text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8), 0 0 12px rgba(255, 80, 100, 0.6); }
  #banner.tblue { border-color: #4aa6ff; color: #8ed0ff; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55), 0 0 22px rgba(60, 150, 255, 0.45); text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8), 0 0 12px rgba(70, 160, 255, 0.6); }
  #banner.tred { border-color: #ff5a5a; color: #ffa096; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55), 0 0 22px rgba(255, 70, 70, 0.45); text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8), 0 0 12px rgba(255, 80, 80, 0.6); }
  #banner.small { font-size: clamp(16px, 3vh, 32px); padding: .18em .7em; }
  #banner.show { animation: bannerFloat 2.4s ease-out; }
  @keyframes bannerFloat { 0% { opacity: 0; transform: translate(-50%, -12px) scale(.88); } 12% { opacity: 1; transform: translate(-50%, 0) scale(1); } 78% { opacity: 1; transform: translate(-50%, 0) scale(1); } 100% { opacity: 0; transform: translate(-50%, -8px) scale(.95); } }

  /* ---------- Thẻ quà khủng: dành riêng cho quà giá trị lớn ---------- */
  #epicCard { position: fixed; left: 50%; top: 44%; z-index: 40; width: min(78vw, 460px); padding: .9em 1.2em 1em; border-radius: 22px; text-align: center;
    opacity: 0; pointer-events: none; transform: translate(-50%, -50%) scale(.5);
    background: linear-gradient(135deg, rgba(61, 42, 85, 0.88), rgba(28, 15, 48, 0.94)); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 3px solid var(--gold); box-shadow: 0 0 0 4px var(--deep), 0 0 40px 10px rgba(255, 207, 74, .65), 0 8px 0 rgba(0,0,0,.4); }
  #epicCard.legend { border-color: #ff6bd6; box-shadow: 0 0 0 4px var(--deep), 0 0 55px 14px rgba(255, 107, 214, .75), 0 8px 0 rgba(0,0,0,.4); }
  #epicCard img, #epicCard i { width: 4.4em; height: 4.4em; border-radius: 50%; border: 3px solid var(--gold); object-fit: cover; background: var(--dim); }
  #epicCard.legend img, #epicCard.legend i { border-color: #ff6bd6; }
  #epicCard .ec-tier { font-size: clamp(12px, 2vh, 18px); font-weight: 800; letter-spacing: .04em; color: var(--gold); text-shadow: var(--outs); margin-bottom: .35em; }
  #epicCard.legend .ec-tier { color: #ff9ae4; }
  #epicCard .ec-name { margin-top: .3em; font-size: clamp(18px, 3.2vh, 30px); font-weight: 800; color: var(--cream); text-shadow: var(--out); }
  #epicCard .ec-txt { font-size: clamp(13px, 2.1vh, 20px); opacity: .95; margin-top: .15em; text-shadow: var(--outs); }
  #epicCard.show { opacity: 1; animation: epicPop 2.5s cubic-bezier(.2, 1.6, .4, 1) forwards; }
  @keyframes epicPop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.4); }
    14% { opacity: 1; transform: translate(-50%, -50%) scale(1.1) rotate(-1.5deg); }
    22% { transform: translate(-50%, -50%) scale(1) rotate(0); }
    84% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(.92); }
  }

  /* ---------- Kết quả ---------- */
  #result { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; text-align: center; background: radial-gradient(rgba(30, 10, 46, .82), rgba(12, 4, 22, .95)); animation: fade .4s ease-out; overflow: hidden; }
  body.result-open #demoTag,
  body.result-open #guide,
  body.result-open .tty,
  body.result-open #feed,
  #result:not([hidden]) ~ #demoTag,
  #result:not([hidden]) ~ #guide,
  #result:not([hidden]) ~ .tty { display: none !important; }
  #result::before { content: ''; position: absolute; inset: -30%; z-index: -1; pointer-events: none;
    background: repeating-conic-gradient(rgba(255, 222, 130, .09) 0deg 7deg, transparent 7deg 18deg); animation: rays 50s linear infinite; }
  @keyframes rays { to { transform: rotate(360deg); } }
  #rTitle { margin: 0; font-size: clamp(30px, 7vh, 72px); font-weight: 800; line-height: 1.08;
    background: linear-gradient(#fff6c8, #ffcf4a 55%, #f08a1a); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 0 #14081e) drop-shadow(0 0 26px rgba(255, 140, 40, .65)); }
  #rTitle.tblue { background: linear-gradient(#e4f3ff, #6cb8ff 55%, #2469d0); -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 4px 0 #14081e) drop-shadow(0 0 24px rgba(60, 150, 255, .7)); }
  #rTitle.tred { background: linear-gradient(#ffe0dc, #ff7d70 55%, #d02c2c); -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 4px 0 #14081e) drop-shadow(0 0 24px rgba(255, 70, 70, .7)); }
  #result h2 { margin: 1.6vh 0 .8vh; font-size: clamp(14px, 2.4vh, 24px); font-weight: 800; color: var(--gold); text-shadow: var(--out); }
  #result .sub { font-size: clamp(14px, 2.4vh, 24px); opacity: .95; text-shadow: var(--out); }
  #result .rs { display: flex; justify-content: center; gap: 1.6vh; margin: 1vh 0 1vh; }
  #result .rs .st svg { width: clamp(46px, 9vh, 96px); }
  #result ol { list-style: none; margin: 0 auto; padding: 0; width: min(80vw, 440px); font-size: clamp(15px, 2.6vh, 26px); }
  #result li { display: flex; justify-content: space-between; gap: 1em; padding: .1em .7em; border-radius: 10px; margin-bottom: .6vh; background: linear-gradient(#3d2a55, #241537); border: 2px solid var(--deep); box-shadow: inset 0 1px 0 rgba(255,255,255,.14); }
  #result li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #result li b { color: var(--ember); white-space: nowrap; }
  #result li .rank { color: var(--cream); margin-right: .15em; }
  #result li.top1 { border-color: var(--gold); box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 0 14px rgba(255, 207, 74, .6); }
  #result li.top1 .rank { color: var(--gold); }
  #result p { margin: 1.4vh 0 0; font-size: clamp(14px, 2.4vh, 24px); opacity: .92; text-shadow: var(--out); }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  #rTeams { display: flex; gap: 2vh; justify-content: center; margin-top: 1vh; }
  .tcolr { flex: 1; max-width: 46vw; min-width: 0; border-top: 6px solid var(--c); border-radius: 12px; padding: .6vh 1vh 1vh; background: linear-gradient(rgba(60, 38, 88, .85), rgba(30, 16, 46, .85)); }
  .tcolr.win { box-shadow: 0 0 26px var(--c); }
  .tcolr h3 { margin: 0; color: var(--c); font-size: clamp(18px, 3.2vh, 34px); text-shadow: var(--out); }
  .tcolr .rs { margin: .4vh 0 !important; }
  .tcolr .rs .st svg { width: clamp(30px, 6vh, 64px); }
  .tcolr .rs .st span { display: none; }
  .tpct { font-weight: 800; font-size: clamp(20px, 4vh, 44px); text-shadow: var(--out); }
  .tcolr ol { width: auto !important; font-size: clamp(12px, 2vh, 20px) !important; }
  .tcolr .mv { font-size: clamp(11px, 1.7vh, 18px); opacity: .9; margin-top: .4vh; }

  /* ---------- HUD chế độ đội (thiết kế gọn gàng, thẻ nổi mờ) ---------- */
  #hudT { position: fixed; top: 1.2vh; left: 50%; transform: translateX(-50%); width: min(94vw, 680px);
    padding: .35vh .65vh .4vh; border-radius: 14px;
    background: linear-gradient(180deg, rgba(34, 18, 54, 0.82), rgba(18, 9, 30, 0.9));
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1.5px solid rgba(255, 207, 74, 0.32);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.52), inset 0 1px 0 rgba(255, 255, 255, 0.14); }
  .t-top-row { display: flex; align-items: center; justify-content: space-between; gap: .4vh; margin-bottom: .25vh; }
  .t-side-meta { display: flex; align-items: center; gap: .4vh; min-width: 0; }
  .t-side-meta.r { justify-content: flex-end; }
  .t-center-meta { display: flex; align-items: center; justify-content: center; gap: .4vh; flex-wrap: nowrap; }
  #tScore { font-weight: 800; font-size: clamp(10px, 1.4vh, 16px); padding: .04em .55em; border-radius: 8px;
    background: linear-gradient(135deg, rgba(61, 42, 85, 0.82), rgba(36, 21, 55, 0.88)); border: 1.5px solid var(--deep); text-shadow: var(--outs); box-shadow: 0 2px 0 rgba(0,0,0,.35); white-space: nowrap; }
  #tPhase { font-weight: 800; font-size: clamp(9px, 1.2vh, 14px); padding: .04em .55em; border-radius: 8px;
    background: linear-gradient(135deg, rgba(61, 42, 85, 0.82), rgba(36, 21, 55, 0.88)); border: 1.5px solid var(--deep); text-shadow: var(--outs); box-shadow: 0 2px 0 rgba(0,0,0,.35); white-space: nowrap; }
  #tPhase:empty { display: none; }
  #tPhase.golden { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 10px rgba(255,200,60,.7), 0 2px 0 rgba(0,0,0,.4); }
  #tPhase.ot { border-color: #ff4a5e; color: #ff8a96; animation: throb .5s infinite alternate; }

  .tbars { display: flex; gap: .6vh; }
  .tb { position: relative; flex: 1; height: clamp(16px, 2.3vh, 26px); background: linear-gradient(135deg, rgba(21, 10, 34, 0.9), rgba(42, 23, 64, 0.9)); border: 1.5px solid var(--deep); border-radius: 999px; overflow: hidden; box-shadow: 0 0 0 1.5px var(--tc), 0 2px 0 rgba(0,0,0,.35); }
  .tb.blue { --tc: #4aa6ff; } .tb.red { --tc: #ff6060; }
  .tb .fill { width: 0; }
  .tb.blue .fill { left: 0; background: linear-gradient(90deg, #2a6fe0, #63b6ff); }
  .tb.red .fill { right: 0; background: linear-gradient(270deg, #e03a3a, #ff8a70); }
  .tb span { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: clamp(10px, 1.4vh, 15px); text-shadow: var(--out); font-variant-numeric: tabular-nums; z-index: 3; }

  .t-tug-wrap { position: relative; margin: .2vh 0 .15vh; }
  #tug { position: relative; height: clamp(5px, .8vh, 8px); border-radius: 999px; border: 1px solid var(--deep); background: linear-gradient(90deg, #2a6fe0, #63b6ff 42%, #ddd 50%, #ff8a70 58%, #e03a3a); box-shadow: 0 1px 0 rgba(0,0,0,.3); }
  #tugMark { position: absolute; top: -3px; bottom: -3px; width: 6px; margin-left: -3px; border-radius: 2px; background: linear-gradient(#fff, #ffd76a); border: 1px solid var(--deep); left: 50%; transition: left .35s ease-out; box-shadow: 0 0 4px rgba(255, 207, 74, .85); }
  #tugTxt { text-align: center; font-weight: 800; font-size: clamp(8px, 1.1vh, 12px); margin-top: .1vh; text-shadow: var(--outs); min-height: 1.1em; line-height: 1.1; }

  // Chi tiết địa hình trung lộ: Lối mòn hành quân, lạch nước và cầu đá vòm 2.5D
  function drawTacticalGroundDetails(mx0, my0, mW, mH, dx, dy, team, t) {
    if (team) {
      // 1. Dòng lạch nước uốn lượn chạy ngang giữa bản đồ ngăn cách 2 phe
      const cy = PY(arena.h / 2);
      const rH = 8.5 * k;
      // Bờ đất và sỏi đá ven sông
      ctx.fillStyle = '#2d5122';
      ctx.fillRect(mx0, cy - rH * 0.65, mW, rH * 1.3);
      ctx.fillStyle = '#406b2f';
      ctx.fillRect(mx0, cy - rH * 0.52, mW, rH * 1.04);

        [0, '#195570'], [0.25, '#2b84a0'], [0.5, '#3ba8c8'], [0.75, '#267b96'], [1, '#174d64']
      ]);

        ctx.quadraticCurveTo(sx + 8 * k, sy - 2 * k, sx + 16 * k, sy);
        ctx.stroke();

      });

      ctx.fillRect(bx0, cy - rH * 0.3, bW, rH * 0.7);

      ctx.fillStyle = lgr(0, by0, 0, by0 + bH, [[0, '#75707c'], [0.5, '#5d5865'], [1, '#443f4c']]);

      });

    }
  }

    ctx.beginPath(); rr(x - s * .2, y - s * 2.1, s * .4, s * 2.1, s * .1); FS('#5a3a22', Math.max(1.4, s * .12));
    ctx.beginPath(); ctx.moveTo(x - s * .55, y - s * 2.5); ctx.lineTo(x + s * .55, y - s * 2.5); ctx.lineTo(x + s * .35, y - s * 1.95); ctx.lineTo(x - s * .35, y - s * 1.95); ctx.closePath(); FS('#7a7a86', Math.max(1.4, s * .12));
    ctx.fillStyle = rgr(x, y - s * 3, 0, s * 4.2, [[0, 'rgba(255,200,110,.30)'], [1, 'rgba(255,170,60,0)']]); circle(x, y - s * 3, s * 4.2); ctx.fill();
    flame(x, y - s * 2.9, s * .7 * fl, t, i);
  }

  // Tường thành đá phòng ngự 2.5D Isometric hình chữ V (bastion rampart) bảo vệ hậu phương căn cứ
  function drawFortressWall(cx, cy, w, color, label, inverted = false) {
    const hw = w * 0.44;
    const slope = inverted ? -0.26 : 0.26;
    
    // Tọa độ 3 mấu chốt trong không gian game: Trụ trái, Đỉnh trung tâm, Trụ phải
    const p0 = { x: PX(cx), y: PY(cy) };
    const pL = { x: PX(cx - hw), y: PY(cy + hw * slope) };
    const pR = { x: PX(cx + hw), y: PY(cy + hw * slope) };
    
    const wallH = 5.2 * k; // Chiều cao đứng của mặt tường đá
    const wallT = 3.2 * k; // Độ dày mặt tường lát đá
    const bCol = color || '#ffcf4a';
    
    ctx.save();
    
    // 1. Đổ bóng chân thành trên mặt cỏ
    ctx.fillStyle = 'rgba(0, 0, 0, 0.32)';
    ctx.beginPath();
    ctx.moveTo(pL.x, pL.y + wallH * 0.7);
    ctx.lineTo(p0.x, p0.y + wallH * 0.7);
    ctx.lineTo(pR.x, pR.y + wallH * 0.7);
    ctx.lineTo(pR.x, pR.y + wallH * 1.3);
    ctx.lineTo(p0.x, p0.y + wallH * 1.3);
    ctx.lineTo(pL.x, pL.y + wallH * 1.3);
    ctx.closePath();
    ctx.fill();

    // Hàm vẽ 1 cánh tường thành (từ A sang B) theo góc phối cảnh 2.5D
    const drawWing = (a, b) => {
      // Mặt đứng tường đá (Front vertical face)
      const gradFace = lgr(0, Math.min(a.y, b.y), 0, Math.max(a.y, b.y) + wallH, [
        [0, '#66606d'], [0.4, '#4e4854'], [1, '#322d38']
      ]);
      ctx.fillStyle = gradFace;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y + (inverted ? -wallT * 0.5 : wallT * 0.5));
      ctx.lineTo(b.x, b.y + (inverted ? -wallT * 0.5 : wallT * 0.5));
      ctx.lineTo(b.x, b.y + wallH);
      ctx.lineTo(a.x, a.y + wallH);
      ctx.closePath();
      FS(gradFace, Math.max(1.4, k * 0.14));

      // Kẻ vân gạch đá xếp lớp trên mặt đứng
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.28)';
      ctx.lineWidth = Math.max(1, k * 0.12);
      for (let f = 0.3; f < 0.9; f += 0.3) {
        ctx.beginPath();
        ctx.moveTo(a.x, a.y + wallH * f);
        ctx.lineTo(b.x, b.y + wallH * f);
        ctx.stroke();
      }

      // Mặt trên lối đi lát đá (Top walkway)
      const gradTop = lgr(0, a.y - wallT, 0, b.y + wallT, [[0, '#8c8695'], [1, '#6b6574']]);
      ctx.fillStyle = gradTop;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y - wallT * 0.5);
      ctx.lineTo(b.x, b.y - wallT * 0.5);
      ctx.lineTo(b.x, b.y + wallT * 0.5);
      ctx.lineTo(a.x, a.y + wallT * 0.5);
      ctx.closePath();
      FS(gradTop, Math.max(1.2, k * 0.12));

      // Lỗ châu mai (Crenellations) dọc theo cánh thành
      const dist = Math.hypot(b.x - a.x, b.y - a.y);
      const crens = Math.max(3, Math.round(dist / (7 * k)));
      ctx.fillStyle = lgr(0, a.y - wallH * 0.5, 0, b.y, [[0, '#9e98a7'], [1, '#66606d']]);
      for (let i = 0; i < crens; i += 2) {
        const t1 = (i + 0.15) / crens, t2 = (i + 0.85) / crens;
        const x1 = a.x + (b.x - a.x) * t1, y1 = a.y + (b.y - a.y) * t1;
        const x2 = a.x + (b.x - a.x) * t2, y2 = a.y + (b.y - a.y) * t2;
        const crH = 2.4 * k;
        ctx.beginPath();
        ctx.moveTo(x1, y1 - wallT * 0.5);
        ctx.lineTo(x2, y2 - wallT * 0.5);
        ctx.lineTo(x2, y2 - wallT * 0.5 - crH);
        ctx.lineTo(x1, y1 - wallT * 0.5 - crH);
        ctx.closePath();
        FS(ctx.fillStyle, Math.max(1, k * 0.1));
      }
    };

    // Vẽ 2 cánh thành hướng theo góc kim cương
    drawWing(pL, p0);
    drawWing(p0, pR);

    // 2. Ba tháp canh đá bát giác 2.5D (Octagonal Bastion Towers) tại 3 điểm mút
    const towers = [
      { pt: pL, main: false },
      { pt: p0, main: true },
      { pt: pR, main: false }
    ];

    towers.forEach(({ pt, main }, idx) => {
      const tRad = (main ? 3.4 : 2.8) * k;
      const tH = (main ? 7.8 : 6.5) * k;

      // Đổ bóng chân tháp
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ell(pt.x, pt.y + wallH * 0.9, tRad * 1.5, tRad * 0.75); ctx.fill();

      // Thân tháp đá bát giác kiên cố
      const tGrad = lgr(pt.x - tRad, 0, pt.x + tRad, 0, [
        [0, '#4e4854'], [0.35, '#787280'], [0.75, '#5d5764'], [1, '#3b3540']
      ]);
      ctx.fillStyle = tGrad;
      ctx.beginPath();
      rr(pt.x - tRad, pt.y - tH * 0.5, tRad * 2, tH, 2 * k);
      FS(tGrad, Math.max(1.5, k * 0.15));

      // Vòng đai đá gia cố và lỗ châu mai đỉnh tháp
      ctx.fillStyle = lgr(0, pt.y - tH * 0.65, 0, pt.y - tH * 0.45, [[0, '#9e98a7'], [1, '#66606d']]);
      rr(pt.x - tRad * 1.15, pt.y - tH * 0.65, tRad * 2.3, 2.2 * k, 1.5); ctx.fill();
      FS(ctx.fillStyle, Math.max(1.2, k * 0.12));

      // Cột cờ gỗ và cờ lụa bay phấp phới
      const poleX = pt.x + (main ? 0 : (idx === 0 ? -tRad * 0.3 : tRad * 0.3));
      const poleTop = pt.y - tH * 0.65 - (main ? 8 : 6.5) * k;
      ctx.strokeStyle = '#3d2516'; ctx.lineWidth = Math.max(2, k * 0.2); ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(poleX, pt.y - tH * 0.5);
      ctx.lineTo(poleX, poleTop);
      ctx.stroke();

      // Chóp cọc mạ vàng
      ctx.fillStyle = '#ffd23a'; circle(poleX, poleTop, Math.max(2.2, k * 0.22)); ctx.fill();

      // Lá cờ lụa màu đội tuyển tung bay
      const flagW = (main ? 9.5 : 7.5) * k;
      const flagH = (main ? 5.5 : 4.5) * k;
      ctx.fillStyle = bCol;
      ctx.beginPath();
      ctx.moveTo(poleX, poleTop);
      ctx.quadraticCurveTo(poleX + flagW * 0.5, poleTop + 1.2 * k, poleX + flagW, poleTop + flagH * 0.35);
      ctx.lineTo(poleX, poleTop + flagH);
      ctx.closePath();
      FS(bCol, Math.max(1.2, k * 0.12));

      // Chậu đuốc rực sáng trên các tháp biên
      if (!main) {
        const brazierX = pt.x + (idx === 0 ? tRad * 0.6 : -tRad * 0.6);
        const brazierY = pt.y - tH * 0.65;
        ctx.fillStyle = '#4a4852';
        rr(brazierX - 1.2 * k, brazierY - 1 * k, 2.4 * k, 1.8 * k, 1); ctx.fill();
        flame(brazierX, brazierY - 1.6 * k, 0.65 * k, performance.now() || 0, 70 + idx);
      }
    });

    ctx.restore();
  }

  // Vạch xuất kích quân đội dã chiến kiểu Clash of Clans ở phần đáy bản đồ
  function drawDeploymentZone(t) {
    const my = arena.h - 18;
    const y = PY(my), cx = PX(arena.cx), w_units = arena.w * 0.8, W_px = w_units * k;
    const leftX = cx - W_px / 2, rightX = cx + W_px / 2;
    const pulse = 0.6 + 0.25 * Math.sin(t * 0.005);
    ctx.save();
    
    // 1. Nền bục dã chiến bằng đất nện viền xà gỗ
    const platH = 5.2 * k;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.26)';
    rr(leftX - 1 * k, y + 2, W_px + 2 * k, platH, 3 * k); ctx.fill();

    // Khung gỗ viền bục
    ctx.fillStyle = lgr(0, y, 0, y + platH, [[0, '#6e4424'], [0.5, '#523319'], [1, '#38200e']]);
    rr(leftX, y, W_px, platH, 2.5 * k); ctx.fill();
    ctx.strokeStyle = '#855630'; ctx.lineWidth = Math.max(1.5, k * 0.14);
    rr(leftX, y, W_px, platH, 2.5 * k); ctx.stroke();

    // 2. Đường vạch xuất trận dạng nét đứt phát sáng vàng cam
    ctx.strokeStyle = `rgba(255, 207, 74, ${pulse})`;
    ctx.lineWidth = Math.max(2.4, k * 0.28);
    ctx.setLineDash([k * 1.8, k * 1.2]);
    ctx.beginPath();
    ctx.moveTo(leftX + 3 * k, y + platH * 0.5);
    ctx.lineTo(rightX - 3 * k, y + platH * 0.5);
    ctx.stroke();
    ctx.setLineDash([]);
    
    // 3. Rào chắn chông gỗ dã chiến (barricades) ở 2 bên cánh
    [-1, 1].forEach((dir) => {
      const sx = dir === -1 ? leftX - k * 3.5 : rightX + k * 1.5;
      for (let i = 0; i < 3; i++) {
        const px = sx + dir * i * k * 2.2, py = y + platH * 0.5 + (i % 2 ? k * 0.7 : -k * 0.3);
        ctx.save(); ctx.translate(px, py); ctx.rotate(dir * (0.2 + i * 0.08));
        ctx.fillStyle = 'rgba(0,0,0,.25)'; ell(0, k * .5, k * 1.2, k * .3); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-k * .35, k * .6);
        ctx.lineTo(0, -k * 1.5);
        ctx.lineTo(k * .35, k * .6);
        ctx.closePath();
        FS(lgr(-k * .35, 0, k * .35, 0, [[0, '#85542b'], [.6, '#b0733c'], [1, '#5a3418']]), Math.max(1.4, k * .12));
        ctx.restore();
      }
    });

    // 4. Hai ngọn đuốc tiền tuyến rực sáng ở 2 đầu bục xuất kích
    torch(leftX - k * 1.2, y + platH * 0.5, t, 11);
    torch(rightX + k * 1.2, y + platH * 0.5, t, 12);
    
    // 5. Thẻ biển báo chiến thuật in sắc nét nổi bật: "⚔️ VẠCH XUẤT KÍCH · THẢ QUÂN ⚔️"
    const fs = Math.max(10, k * 1.5);
    ctx.font = `800 ${fs}px 'Baloo 2', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const textW = ctx.measureText('⚔️ VẠCH XUẤT KÍCH · THẢ QUÂN ⚔️').width;
    const badgeW = textW + 24, badgeH = fs * 1.7;
    const badgeY = y + platH * 0.5;
    
    // Khung pill biển báo
    ctx.fillStyle = 'rgba(22, 12, 34, 0.88)';
    ctx.strokeStyle = `rgba(255, 207, 74, ${pulse * 0.9})`;
    ctx.lineWidth = Math.max(1.5, k * 0.16);
    rr(cx - badgeW / 2, badgeY - badgeH / 2, badgeW, badgeH, 999);
    ctx.fill(); ctx.stroke();
    
    // Chữ vàng rực
    ctx.fillStyle = `rgba(255, 228, 140, ${pulse * 0.95})`;
    ctx.fillText('⚔️ VẠCH XUẤT KÍCH · THẢ QUÂN ⚔️', cx, badgeY);
    ctx.restore();
  }

  function drawAmbient(t) {
    if (!GROUND_ON) return;
    const G = groundRect();
    for (let i = 0; i < 4; i++) { // bóng mây trôi trên mặt đất
      const span = G.x1 - G.x0 + 90, wx = G.x0 - 45 + ((t * .0016 * (.7 + i * .25) + i * 61) % span), wy = G.y0 + (i * .27 + .12) * (G.y1 - G.y0), rx = k * (17 + i * 3);
      ctx.save(); ctx.translate(PX(wx), PY(wy)); ctx.scale(1, .55); ctx.fillStyle = rgr(0, 0, 0, rx, [[0, 'rgba(8,30,8,.16)'], [1, 'rgba(8,30,8,0)']]); circle(0, 0, rx); ctx.fill(); ctx.restore();
    }
    // Trang trí sống động phần trên đầu và phần dưới chiến trường
    if (mode === 'solo') {
      // Phía trên đầu: Tường thành 2.5D bảo vệ hậu phương
      drawFortressWall(arena.cx, 13, 56, '#ffcf4a', 'HOÀNG THÀNH', false);
      // Phía dưới: Bục xuất kích dã chiến & Đuốc tiền tuyến
      drawDeploymentZone(t);
    } else {
      // Chế độ Đội: Căn cứ Xanh ở phía trên (chữ V chúc xuống), Căn cứ Đỏ ở phía dưới (chữ V ngửa lên)
      const bx = arena.bx != null ? arena.bx : (arena.w * 0.16);
      drawFortressWall(arena.cx - bx, 11, 48, TC('blue'), 'ĐỘI XANH', false);
      drawFortressWall(arena.cx + bx, arena.h - 11, 48, TC('red'), 'ĐỘI ĐỎ', true);
    }
  }
  function drawButterflies(t) {
    if (!GROUND_ON) return;
    const cols = ['#ff8fc8', '#ffd23a', '#8fd8ff', '#ffffff'];
    for (let i = 0; i < 5; i++) {
      const wx = arena.cx + Math.sin(t * .0004 + i * 2.1) * (mode === 'team' ? 46 : 42);
      const wy = (arena.h / 2) + Math.cos(t * .00031 + i * 3.3) * (arena.h * 0.38);
      const x = PX(wx), y = PY(wy) - k * 3 + Math.sin(t * .004 + i) * k, f = Math.abs(Math.sin(t * .022 + i)) * .8 + .2, s = k * .55;
      ctx.fillStyle = cols[i % 4]; ell(x - s * .6 * f, y, s * .7 * f, s * .5, -.4); ctx.fill(); ell(x + s * .6 * f, y, s * .7 * f, s * .5, .4); ctx.fill();
      ctx.fillStyle = '#3a2a30'; ell(x, y, s * .13, s * .5); ctx.fill();
    }
  }

  function drawRune(t) { // vòng phù văn nơi Rồng canh kho báu (phối cảnh 2.5D dạng ellipse quả trám)
    const my = arena.h / 2;
    const cx = PX(arena.cx), cy = PY(my), pulse = hud.bo ? 1 + .06 * Math.sin(t * .008) : 1;
    const rx = 10 * k * pulse, ry = rx * 0.55;
    ctx.strokeStyle = 'rgba(255,214,110,.7)'; ctx.lineWidth = Math.max(2.2, k * .6);
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = Math.max(1.2, k * .3);
    ctx.beginPath(); ctx.ellipse(cx, cy, rx * 0.72, ry * 0.72, 0, 0, Math.PI * 2); ctx.stroke();
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4 + t * .0003;
      const cos = Math.cos(a), sin = Math.sin(a);
      ctx.beginPath();
      ctx.moveTo(cx + cos * rx * 0.74, cy + sin * ry * 0.74);
      ctx.lineTo(cx + cos * rx * 0.98, cy + sin * ry * 0.98);
      ctx.stroke();
    }
  }

  // Nền cỏ, sân đá, hoa cỏ không đổi nên chỉ vẽ MỘT lần vào canvas phụ rồi dán lại mỗi khung hình: nhẹ hơn nhiều cho OBS
  let gCache = null, gKey = '';
  function drawGround(t) {
    if (!GROUND_ON) return;
    if (NOCACHE) { paintGround(t); if (mode === 'team') drawRune(t); return; }
    const key = [W, H, k.toFixed(3), ax.toFixed(1), ay.toFixed(1), mode, arena.h, decor.length, AS.ver].join('|');
    if (key !== gKey || !gCache) {
      const dpr = cv.width / W;
      gCache = document.createElement('canvas'); gCache.width = cv.width; gCache.height = cv.height;
      const oc = gCache.getContext('2d'); oc.setTransform(dpr, 0, 0, dpr, 0, 0);
      const real = ctx; ctx = oc;
      try { paintGround(t); } finally { ctx = real; }
      gKey = key;
    }
    ctx.drawImage(gCache, 0, 0, W, H);
    if (mode === 'team') drawRune(t);
  }

  function drawTree(d, t = 0) {
    const dsp = dSprite('tree', d.v);
    if (dsp) { ctx.save(); ctx.translate(PX(d.x), PY(d.y)); ctx.fillStyle = 'rgba(0,0,0,.26)'; ell(k * .4, k * .1, k * 2.4 * d.s, k * .9 * d.s); ctx.fill(); ctx.rotate(Math.sin(t * .0013 + d.x) * .015); blitSprite(dsp.im, dsp.e, (dsp.e.w || 7) * k * d.s, null, .95); ctx.restore(); return; }
    const x = PX(d.x), y = PY(d.y), s = d.s * k * 1.5, sw = Math.sin(t * .0013 + d.x) * s * .05, lw = Math.max(1.8, s * .05);
    ctx.fillStyle = 'rgba(0,0,0,.26)'; ell(x + s * .25, y + s * .08, s * .95, s * .34); ctx.fill();
    ctx.beginPath(); rr(x - s * .15, y - s * .95, s * .3, s * .95, s * .08); FS(lgr(x - s * .15, 0, x + s * .15, 0, [[0, '#94602f'], [1, '#6a4020']]), lw);
    const blob = (cx, cy, r, c1, c2) => { circle(cx, cy, r); FS(lgr(cx - r, cy - r, cx + r, cy + r, [[0, c1], [1, c2]]), lw); };
    blob(x - s * .48 + sw, y - s * 1.2, s * .62, '#63c24c', '#2f8a34'); blob(x + s * .5 + sw, y - s * 1.22, s * .6, '#5fbe4a', '#2c8432'); blob(x + sw * 1.6, y - s * 1.7, s * .72, '#80d95e', '#3a9c3c');
  }
  function drawRock(d) {
    const dsp = dSprite('rock', d.v);
    if (dsp) { ctx.save(); ctx.translate(PX(d.x), PY(d.y)); ctx.fillStyle = 'rgba(0,0,0,.24)'; ell(k * .3, k * .1, k * 1.8 * d.s, k * .6 * d.s); ctx.fill(); blitSprite(dsp.im, dsp.e, (dsp.e.w || 4) * k * d.s, null, .9); ctx.restore(); return; }
    const x = PX(d.x), y = PY(d.y), s = d.s * k * 1.1, lw = Math.max(1.6, s * .07);
    ctx.fillStyle = 'rgba(0,0,0,.24)'; ell(x + s * .2, y + s * .1, s, s * .32); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - s * .9, y); ctx.lineTo(x - s * .6, y - s * .7); ctx.lineTo(x + s * .1, y - s * .95); ctx.lineTo(x + s * .8, y - s * .5); ctx.lineTo(x + s * .95, y); ctx.closePath(); FS(lgr(x - s, y - s, x + s, y, [[0, '#c8c2b8'], [1, '#8a8478']]), lw);
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.moveTo(x - s * .5, y - s * .55); ctx.lineTo(x + s * .05, y - s * .82); ctx.lineTo(x - s * .1, y - s * .5); ctx.closePath(); ctx.fill();
  }

  /* ================== Công trình ================== */
  function flame(x, y, r, t, i) {
    const rr_ = r * (1 + .3 * Math.sin(t * .012 + i * 2));
    ctx.fillStyle = rgr(x, y, 0, rr_ * 1.6, [[0, 'rgba(255,240,170,.95)'], [.4, 'rgba(255,140,40,.85)'], [1, 'rgba(200,40,20,0)']]);
    ctx.beginPath(); ctx.ellipse(x, y - rr_ * .3, rr_, rr_ * 1.6, 0, 0, Math.PI * 2); ctx.fill();
  }
  const CRACKS = [
    [[-.1, -.05], [-.14, .08], [-.08, .16], [-.16, .3]], [[.15, 0], [.1, .12], [.18, .22], [.12, .38]],
    [[0, -.3], [.04, -.2], [-.02, -.12]], [[-.28, .1], [-.22, .2], [-.3, .3]], [[.28, .05], [.24, .18], [.3, .28]],
  ];

  function plinth(R, b) {
    // Nền móng công trình dạng quả trám 2.5D isometric chuẩn Clash of Clans
    const n = (b.type === 'townHall') ? 4 : (b.radius >= 4 ? 3 : 2); // số ô lưới (2x2, 3x3, 4x4)
    const hw = R * 1.34;      // bán trục ngang của khối quả trám
    const hh = hw * 0.55;     // bán trục đứng theo góc nghiêng phối cảnh 2.5D isometric
    const baseY = R * 0.44;   // chân móng công trình
    const depth = Math.max(3.2, R * 0.13); // độ dày khối đá vát xuống đất
    const teamCol = (mode === 'team' && b.team !== 'def') ? TC(b.team) : null;

    const left = status === 'playing' ? Math.ceil(localLeft(hud.tl)) : 0, tx = mmss(left), gold = !!(hud.gd && status === 'playing');
    if (tx !== tTimerText) { tTimerText = tx; $('tTimer').textContent = tx; }
    $('tTimer').classList.toggle('low', left <= 20 && left > 0 && !gold); $('tTimer').classList.toggle('gold', gold);
    sfx.speed(hud.gd || hud.ot ? 1.6 : 1);
    const ph = $('tPhase'); ph.className = ''; ph.style.color = '';
    if (status !== 'playing') ph.textContent = '';
    else if (hud.ot) { ph.textContent = 'HIỆP PHỤ: phá được công trình trước là thắng'; ph.classList.add('ot'); }
    else if (hud.gd) { ph.textContent = 'GIỜ VÀNG ×' + ((cfg.team.golden && cfg.team.golden.mult) || 2); ph.classList.add('golden'); }
    else if (hud.phase === 'clash') { ph.textContent = 'GIAO TRANH ' + Math.ceil(localLeft(hud.pl)) + 's'; ph.style.color = '#ffb347'; }
    else if (hud.phase) { ph.textContent = 'CÔNG THÀNH +' + Math.round(((cfg.team.siegeBonus || 1) - 1) * 100) + '%'; ph.style.color = '#ffcf4a'; }
    else ph.textContent = '';
    $('tScore').textContent = TN('blue') + ' ' + teamScore.blue + ' - ' + teamScore.red + ' ' + TN('red');
    // thanh kéo co: bên nào đang dẫn
    const diff = dispP.blue - dispP.red, ad = Math.abs(diff);
    $('tugMark').style.left = (50 + Math.max(-30, Math.min(30, diff)) / 30 * 46) + '%';
    const tt = $('tugTxt'); if (ad < 1.5) { tt.textContent = 'CÂN BẰNG'; tt.style.color = ''; } else { const lead = diff > 0 ? 'blue' : 'red'; tt.textContent = TU(lead) + ' DẪN ' + Math.round(ad) + '%'; tt.style.color = TC(lead); }
    const on = status === 'playing';
    for (const t of ['blue', 'red']) {
      const T = TS(t), B = t === 'blue' ? 'Blue' : 'Red';
      $('tf' + B).style.width = dispP[t] + '%';
      $('tp' + B).textContent = (t === 'blue' ? '■ ' : '▲ ') + TN(t).toUpperCase() + ' ' + Math.floor(dispP[t]) + '%';
      const hc = teamInfo.handicap && teamInfo.handicap[t] > 1.001 ? '  (+' + Math.round((teamInfo.handicap[t] - 1) * 100) + '% hỗ trợ)' : '';
      $('tc' + B).textContent = (teamInfo.counts ? teamInfo.counts[t] : 0) + ' người' + hc; $('tc' + B).style.color = TC(t);
      $('tu' + B).style.width = (T.fu || 0) + '%'; $('tuT' + B).textContent = 'QUỸ ĐỘI ' + (T.fu || 0) + '%' + (T.fl ? '  ·  mở ×' + T.fl : '');
      const mOn = on && T.mb > 0; $('tmW' + B).classList.toggle('on', mOn);
      $('tm' + B).style.width = (mOn ? Math.min(100, localLeft(T.mb) / ((cfg.team.cheer && cfg.team.cheer.buffSec) || 12) * 100) : (T.mo || 0)) + '%';
      $('tmT' + B).textContent = mOn ? 'HÔ HÀO ×' + ((cfg.team.cheer && cfg.team.cheer.buffMult) || 1.3) + '  ' + Math.ceil(localLeft(T.mb)) + 's' : 'TINH THẦN ' + (T.mo || 0) + '%';
      const cb = T.cb, rg = T.rg, bd = tBadge[t], en = enemyOf(t);
      setBadgeNode(bd.combo, on && cb && cb.n > 0 && localLeft(cb.l) > 0, cb ? '⚡ Combo ' + cb.n + ' (+' + Math.round((cb.m - 1) * 100) + '%)' : '', cb ? localLeft(cb.l) / cb.w : 0);
      setBadgeNode(bd.rage, on && rg && localLeft(rg.l) > 0, rg ? '🔥 Cuồng nộ ×' + rg.m + ' ' + Math.ceil(localLeft(rg.l)) + 's' : '', rg ? localLeft(rg.l) / 15 : 0);
      setBadgeNode(bd.fz, on && localLeft(T.fz) > 0, '❄️ Đóng băng địch ' + Math.ceil(localLeft(T.fz)) + 's', localLeft(T.fz) / 8);
      setBadgeNode(bd.ps, on && localLeft(T.ps) > 0, '☠️ Độc địch ' + Math.ceil(localLeft(T.ps)) + 's', localLeft(T.ps) / 10);
      setBadgeNode(bd.sh, on && localLeft(T.sh) > 0, '🛡️ Khiên ' + Math.ceil(localLeft(T.sh)) + 's', localLeft(T.sh) / 8);
      setBadgeNode(bd.bf, on && localLeft(T.bf) > 0, '🐉 Buff Rồng ×' + ((cfg.team.guardian && cfg.team.guardian.buffMult) || 1.5) + ' ' + Math.ceil(localLeft(T.bf)) + 's', localLeft(T.bf) / 20);
      setBadgeNode(bd.mb, false, '', 0);
      setBadgeNode(bd.cu, on && T.cu, '🏃 Bám đuổi +' + Math.round((((cfg.team.catchUp && cfg.team.catchUp.bonus) || .2)) * 100) + '%', 1);
      renderTally(t);
    }
    syncHudHeight();
  }

  function updateHud() {
    for (const t of ['atk', 'blue', 'red']) dispP[t] += (TS(t).p - dispP[t]) * .12;
    if (resultUntil) $('rNext').textContent = 'Trận mới sau ' + Math.max(0, Math.ceil((resultUntil - Date.now()) / 1000)) + ' giây';
    if (mode === 'team') updateHudTeam(); else updateHudSolo();
  }

  let last = performance.now();
  function frame(t) {
    const dt = Math.min(.05, (t - last) / 1000); last = t;
    updateHud(); updateFx(dt, t);
    ctx.clearRect(0, 0, W, H);
    ctx.save(); if (shake > .5) ctx.translate(rand(-shake, shake) * .6, rand(-shake, shake) * .6);
    drawGround(t); drawAmbient(t); drawDecals(dt);
    if (mode === 'team' && hud.bo) drawChest(t);
    for (const b of bmap.values()) drawBuildingPlinth(b);
    const units = [...umap.values()];
    const items = [...bmap.values()].map((b) => ({ y: b.y, b })).concat(units.map((u) => ({ y: u.y, u }))).concat(decor.filter((d) => d.t === 'tree' || d.t === 'rock').map((d) => ({ y: d.y, d })));
    items.sort((a, b) => a.y - b.y);
    for (const it of items) { if (it.b) drawBuilding(it.b, t); else if (it.u) drawUnit(it.u, t); else if (it.d.t === 'tree') drawTree(it.d, t); else drawRock(it.d); }
    drawShields(t); drawButterflies(t); drawBeams(t); drawTags(units); drawFx(dt, t);
    ctx.restore();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ===== Phím tắt thử (mở bằng trình duyệt trên máy chạy server) =====
     1 Archer  2 Barbarian  3 Hog Rider  4 Giant  5 Balloon  6 Electro Dragon
     7 Lightning  8 Freeze  9 Heal  0 Rage  Q Thiên thạch  W Độc  E Khiên  |  M: tắt/bật tiếng  |  P: đổi chế độ Solo / Đội
     Solo: giữ Shift = gọi 5 cùng lúc. Chế độ đội: số = đội Xanh, Shift + số = đội Đỏ, giữ Alt = gọi 5 cùng lúc. */
  const KEYS = { 1: 'archer', 2: 'barbarian', 3: 'hogRider', 4: 'giant', 5: 'balloon', 6: 'electroDragon', 7: 'lightning', 8: 'freeze', 9: 'heal', 0: 'rage', q: 'meteor', w: 'poison', e: 'shield' };
  const SHIFT_DIGITS = { '!': '1', '@': '2', '#': '3', '$': '4', '%': '5', '^': '6', '&': '7', '*': '8', '(': '9', ')': '0' };
  window.addEventListener('keydown', (e) => {
    sfx.unlock();
    if (e.key === 'm' || e.key === 'M') { sfx.toggle(); return; }
    if (e.key === 'n' || e.key === 'N') { sfx.music(); return; }
    if (e.key === 'p' || e.key === 'P') {
      const nextMode = mode === 'team' ? 'solo' : 'team';
      fetch('/api/admin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'setMode', value: nextMode }) }).catch(() => {});
      return;
    }
    const lk = String(e.key).toLowerCase(), key = KEYS[e.key] ? e.key : (KEYS[lk] && /[qwe]/.test(lk) ? lk : SHIFT_DIGITS[e.key]); if (!key) return;
    const team = mode === 'team' ? (e.shiftKey ? 'red' : 'blue') : 'atk';
    const count = mode === 'team' ? (e.altKey ? 5 : 1) : (e.shiftKey && !/[qwe]/.test(key) ? 5 : 1);
    fetch('/sim?key=' + KEYS[key] + '&count=' + count + '&team=' + team).catch(() => {});
  });
  const mbEl = $('modeBtn');
  if (mbEl) {
    mbEl.addEventListener('click', () => {
      sfx.unlock();
      const nextMode = mode === 'team' ? 'solo' : 'team';
      fetch('/api/admin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'setMode', value: nextMode }) }).catch(() => {});
    });
  }
})();
</script>
</body>
</html>
