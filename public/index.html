<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Công thành chiến</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fff4e0; --gold: #ffcf4a; --ember: #ff8a3d; --rim: #f0b64a; --rim-d: #9a5f14;
    --blue: #3fa0ff; --red: #ff5252; --dim: #5d4a63;
    --p1: #40295a; --p2: #24153a; --deep: #12081c;
    --outs: 0 1px 0 #14081e, 1px 0 0 #14081e, -1px 0 0 #14081e, 0 -1px 0 #14081e;
    --out: 0 2px 0 #14081e, 2px 0 0 #14081e, -2px 0 0 #14081e, 0 -2px 0 #14081e, 2px 2px 0 #14081e, -2px 2px 0 #14081e, 2px -2px 0 #14081e, -2px -2px 0 #14081e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; color: var(--cream); font-family: 'Baloo 2', 'Segoe UI', system-ui, sans-serif; font-weight: 600; line-height: 1.15; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  [hidden] { display: none !important; }
  .txt { text-shadow: var(--out); }

  /* ---------- khung panel kiểu game ---------- */
  .panel { background: linear-gradient(var(--p1), var(--p2)); border: 3px solid var(--deep); border-radius: 14px;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.16), inset 0 -3px 0 rgba(0,0,0,.35), 0 4px 0 rgba(0,0,0,.4); }
  .rim { box-shadow: inset 0 2px 0 rgba(255,255,255,.16), 0 0 0 3px var(--rim), 0 0 0 5px var(--deep), 0 6px 0 5px rgba(0,0,0,.35); }

  /* ---------- HUD solo ---------- */
  #hud { position: fixed; top: 1.8vh; left: 50%; transform: translateX(-50%); width: min(88vw, 720px); }
  .meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: .8vh; }
  #lvl { font-weight: 800; font-size: clamp(16px, 2.6vh, 28px); padding: .05em .9em; border-radius: 10px; background: linear-gradient(#6a3fa0, #43276e); border: 3px solid var(--deep); box-shadow: inset 0 2px 0 rgba(255,255,255,.25), 0 3px 0 rgba(0,0,0,.4); text-shadow: var(--out); }
  #hud.boss #lvl { background: linear-gradient(#c23a4a, #7c1826); }
  #timer, #tTimer { font-weight: 800; font-size: clamp(18px, 3vh, 32px); font-variant-numeric: tabular-nums; padding: .0em .8em; border-radius: 999px; background: linear-gradient(#2b1a42, #170c28); border: 3px solid var(--rim); box-shadow: 0 0 0 3px var(--deep), 0 4px 0 3px rgba(0,0,0,.35); text-shadow: var(--out); }
  #timer.low, #tTimer.low { color: #ff6b5e; animation: throb .5s infinite alternate; }
  #tTimer.gold { color: var(--gold); box-shadow: 0 0 0 3px var(--deep), 0 0 18px 4px rgba(255, 200, 60, .75); }
  @keyframes throb { to { transform: scale(1.08); } }

  .bar { position: relative; height: clamp(26px, 4.2vh, 44px); background: linear-gradient(#150a22, #2a1740); border: 3px solid var(--deep); border-radius: 999px; overflow: hidden;
    box-shadow: 0 0 0 3px var(--rim), 0 0 0 5px var(--deep), 0 6px 0 5px rgba(0,0,0,.35); }
  #hud.boss .bar { box-shadow: 0 0 0 3px #ff6b7a, 0 0 0 5px var(--deep), 0 0 22px 4px rgba(255, 60, 90, .6); }
  #pGhost { position: absolute; inset: 0 auto 0 0; background: #f6e7b0; width: 0; opacity: .55; }
  .fill { position: absolute; top: 0; bottom: 0; width: 0; overflow: hidden; }
  .fill::before { content: ''; position: absolute; inset: 0; background: linear-gradient(rgba(255,255,255,.45), rgba(255,255,255,0) 55%); }
  .fill::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, rgba(255,255,255,.16) 0 10px, transparent 10px 24px); animation: stripes 1.1s linear infinite; }
  @keyframes stripes { to { background-position: 24px 0; } }
  #pFill { left: 0; background: linear-gradient(90deg, #ff7a3d, #ffcf4a); }
  #pMark { position: absolute; top: 0; bottom: 0; left: 50%; width: 3px; background: rgba(18, 8, 28, .75); z-index: 2; }
  #pText, .barText { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: clamp(13px, 2.2vh, 24px); text-shadow: var(--out); font-variant-numeric: tabular-nums; z-index: 3; }

  #stars { display: flex; justify-content: center; gap: 2.4vh; margin-top: 1.2vh; }
  .st { display: flex; flex-direction: column; align-items: center; line-height: 1; }
  .st svg { width: clamp(30px, 5vh, 54px); height: auto; overflow: visible; filter: drop-shadow(0 3px 0 rgba(0,0,0,.45)); }
  .st svg path { fill: url(#gStarOff); stroke: #12081c; stroke-width: 1.6; stroke-linejoin: round; }
  .st span { font-size: clamp(10px, 1.6vh, 16px); opacity: .85; margin-top: .3em; text-shadow: var(--out); }
  .st.on svg { animation: pop .5s cubic-bezier(.2, 1.6, .4, 1); filter: drop-shadow(0 0 10px rgba(255, 190, 60, .9)) drop-shadow(0 3px 0 rgba(0,0,0,.4)); }
  .st.on svg path { fill: url(#gStar); }
  .st.on span { opacity: 1; color: var(--gold); }
  @keyframes pop { 0% { transform: scale(.3) rotate(-30deg); } 100% { transform: scale(1) rotate(0); } }

  #top { display: flex; justify-content: center; gap: .8vh; margin-top: 1vh; flex-wrap: wrap; }
  .chip { display: flex; align-items: center; gap: .45em; font-size: clamp(12px, 1.9vh, 20px); max-width: 30vw; padding: .1em .8em .1em .3em; border-radius: 999px; background: linear-gradient(#3d2a55, #241537); border: 2px solid var(--deep); box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 3px 0 rgba(0,0,0,.35); }
  .chip img, .chip i, .ev img, .ev i { border-radius: 50%; object-fit: cover; background: var(--dim); flex: none; border: 2px solid var(--c, #fff4e0); }
  .chip img, .chip i { width: 1.9em; height: 1.9em; }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip b { color: var(--ember); font-weight: 800; }
  .chip.bounty { border-color: #ff4a5e; box-shadow: 0 0 12px rgba(255, 60, 80, .75), 0 3px 0 rgba(0,0,0,.35); }
  .chip.lead { border-color: var(--gold); box-shadow: 0 0 14px rgba(255, 207, 74, .85), 0 3px 0 rgba(0,0,0,.35); }
  .chip.lead b { color: var(--gold); }

  #badges { display: flex; justify-content: center; gap: .8vh; margin-top: 1vh; flex-wrap: wrap; }
  .badge { position: relative; overflow: hidden; border-radius: 12px; padding: .05em .8em; font-weight: 800; font-size: clamp(12px, 1.9vh, 21px); background: linear-gradient(#2e1d45, #1a0e2b); border: 2px solid var(--c); box-shadow: 0 3px 0 rgba(0,0,0,.4); text-shadow: var(--out); }
  .badge i { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--c); transition: width .2s linear; }
  #combo { --c: var(--ember); } #rage { --c: #b56cff; color: #e6ceff; } #freeze { --c: #a8e6ff; color: #d8f4ff; } #enrage { --c: #ff4a5e; color: #ffb0b8; } #rush { --c: #ff8a3d; color: #ffd9b0; } #mod { --c: #ffcf4a; font-weight: 600; }

  /* ---------- Feed ---------- */
  #feed { position: fixed; left: 2.5vw; bottom: 20vh; width: min(66vw, 460px); display: flex; flex-direction: column; gap: .7vh; }
  .ev { display: flex; align-items: center; gap: .6em; border-left: 6px solid var(--c, var(--ember)); border-radius: 12px; padding: .25em .7em .25em .3em; font-size: clamp(13px, 2.1vh, 22px);
    background: linear-gradient(90deg, rgba(60, 38, 88, .94), rgba(30, 16, 46, .9)); box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 3px 0 rgba(0,0,0,.35); animation: slide .3s ease-out; }
  .ev.out { opacity: 0; transition: opacity .5s; }
  .ev img, .ev i { width: 2.1em; height: 2.1em; }
  .ev .t { min-width: 0; line-height: 1.15; }
  .ev .t div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev .t div + div { opacity: .88; font-size: .9em; }
  .ev .d { margin-left: auto; font-weight: 800; color: var(--ember); font-variant-numeric: tabular-nums; }
  .ev.kill { background: linear-gradient(90deg, rgba(110, 22, 34, .94), rgba(50, 12, 24, .9)); padding-left: .7em; }
  .ev.kill .t div:first-child { font-weight: 800; }
  .ev.big { background: linear-gradient(90deg, rgba(150, 100, 20, .95), rgba(70, 42, 10, .92)); }
  @keyframes slide { from { transform: translateX(-30px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* ---------- Banner ---------- */
  #banner { position: fixed; left: 0; right: 0; top: 30vh; text-align: center; pointer-events: none; font-weight: 800; font-size: clamp(34px, 9vh, 100px); letter-spacing: .02em; opacity: 0; line-height: 1.05;
    background: linear-gradient(#fff6c8, #ffcf4a 55%, #f08a1a); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 4px 0 #14081e) drop-shadow(0 0 22px rgba(255, 140, 40, .7)); }
  #banner.boss { background: linear-gradient(#ffd0d6, #ff5a6a 55%, #b01830); -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 4px 0 #14081e) drop-shadow(0 0 26px rgba(255, 40, 80, .85)); }
  #banner.tblue { background: linear-gradient(#e4f3ff, #6cb8ff 55%, #2469d0); -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 4px 0 #14081e) drop-shadow(0 0 22px rgba(60, 150, 255, .8)); }
  #banner.tred { background: linear-gradient(#ffe0dc, #ff7d70 55%, #d02c2c); -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 4px 0 #14081e) drop-shadow(0 0 22px rgba(255, 70, 70, .8)); }
  #banner.small { font-size: clamp(24px, 6vh, 64px); }
  #banner.show { animation: banner 2.4s ease-out; }
  @keyframes banner { 0% { opacity: 0; transform: scale(2.2); } 14% { opacity: 1; transform: scale(1); } 78% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(.96); } }

  /* ---------- Kết quả ---------- */
  #result { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; background: radial-gradient(rgba(30, 10, 46, .55), rgba(12, 4, 22, .85)); animation: fade .4s ease-out; }
  #result h1 { margin: 0; font-size: clamp(30px, 7vh, 72px); font-weight: 800; text-shadow: var(--out); }
  #result h2 { margin: 1.6vh 0 .8vh; font-size: clamp(14px, 2.4vh, 24px); font-weight: 800; color: var(--gold); text-shadow: var(--out); }
  #result .sub { font-size: clamp(14px, 2.4vh, 24px); opacity: .95; text-shadow: var(--out); }
  #result .rs { display: flex; justify-content: center; gap: 1.6vh; margin: 1vh 0 1vh; }
  #result .rs .st svg { width: clamp(46px, 9vh, 96px); }
  #result ol { list-style: none; margin: 0 auto; padding: 0; width: min(80vw, 440px); font-size: clamp(15px, 2.6vh, 26px); }
  #result li { display: flex; justify-content: space-between; gap: 1em; padding: .1em .7em; border-radius: 10px; margin-bottom: .6vh; background: linear-gradient(#3d2a55, #241537); border: 2px solid var(--deep); box-shadow: inset 0 1px 0 rgba(255,255,255,.14); }
  #result li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #result li b { color: var(--ember); white-space: nowrap; }
  #result p { margin: 1.4vh 0 0; font-size: clamp(14px, 2.4vh, 24px); opacity: .92; text-shadow: var(--out); }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  #rTeams { display: flex; gap: 2vh; justify-content: center; margin-top: 1vh; }
  .tcolr { flex: 1; max-width: 46vw; min-width: 0; border-top: 6px solid var(--c); border-radius: 12px; padding: .6vh 1vh 1vh; background: linear-gradient(rgba(60, 38, 88, .85), rgba(30, 16, 46, .85)); }
  .tcolr.win { box-shadow: 0 0 26px var(--c); }
  .tcolr h3 { margin: 0; color: var(--c); font-size: clamp(18px, 3.2vh, 34px); text-shadow: var(--out); }
  .tcolr .rs { margin: .4vh 0 !important; }
  .tcolr .rs .st svg { width: clamp(30px, 6vh, 64px); }
  .tcolr .rs .st span { display: none; }
  .tpct { font-weight: 800; font-size: clamp(20px, 4vh, 44px); text-shadow: var(--out); }
  .tcolr ol { width: auto !important; font-size: clamp(12px, 2vh, 20px) !important; }
  .tcolr .mv { font-size: clamp(11px, 1.7vh, 18px); opacity: .9; margin-top: .4vh; }

  /* ---------- HUD chế độ đội ---------- */
  #hudT { position: fixed; top: 1.8vh; left: 50%; transform: translateX(-50%); width: min(94vw, 780px); }
  #tScore { font-weight: 800; font-size: clamp(13px, 2.1vh, 22px); padding: .05em .8em; border-radius: 10px; background: linear-gradient(#3d2a55, #241537); border: 3px solid var(--deep); text-shadow: var(--out); box-shadow: 0 3px 0 rgba(0,0,0,.4); }
  #tPhase { font-weight: 800; font-size: clamp(12px, 1.9vh, 20px); padding: .05em .7em; border-radius: 10px; background: linear-gradient(#3d2a55, #241537); border: 2px solid var(--deep); text-shadow: var(--out); min-height: 1.4em; box-shadow: 0 3px 0 rgba(0,0,0,.4); }
  #tPhase.golden { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 14px rgba(255,200,60,.7), 0 3px 0 rgba(0,0,0,.4); }
  #tPhase.ot { border-color: #ff4a5e; color: #ff8a96; animation: throb .5s infinite alternate; }
  .tbars { display: flex; gap: 1.2vh; }
  .tb { position: relative; flex: 1; height: clamp(26px, 4vh, 42px); background: linear-gradient(#150a22, #2a1740); border: 3px solid var(--deep); border-radius: 999px; overflow: hidden; box-shadow: 0 0 0 3px var(--tc), 0 0 0 5px var(--deep), 0 5px 0 5px rgba(0,0,0,.35); }
  .tb.blue { --tc: #4aa6ff; } .tb.red { --tc: #ff6060; }
  .tb .fill { width: 0; }
  .tb.blue .fill { left: 0; background: linear-gradient(90deg, #2a6fe0, #63b6ff); }
  .tb.red .fill { right: 0; background: linear-gradient(270deg, #e03a3a, #ff8a70); }
  .tb span { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: clamp(13px, 2.1vh, 23px); text-shadow: var(--out); font-variant-numeric: tabular-nums; z-index: 3; }
  #tug { position: relative; height: clamp(10px, 1.5vh, 16px); margin: 1.4vh 0 .2vh; border-radius: 999px; border: 2px solid var(--deep); background: linear-gradient(90deg, #2a6fe0, #63b6ff 42%, #ddd 50%, #ff8a70 58%, #e03a3a); box-shadow: 0 3px 0 rgba(0,0,0,.35); }
  #tugMark { position: absolute; top: -70%; bottom: -70%; width: 10px; margin-left: -5px; border-radius: 4px; background: linear-gradient(#fff, #ffd76a); border: 2px solid var(--deep); left: 50%; transition: left .35s ease-out; }
  #tugTxt { text-align: center; font-weight: 800; font-size: clamp(11px, 1.7vh, 18px); margin-top: .5vh; text-shadow: var(--out); min-height: 1.2em; }
  .trow { display: flex; gap: 1.2vh; margin-top: .7vh; }
  .trow > div { flex: 1; display: flex; flex-wrap: wrap; gap: .6vh; align-items: center; min-width: 0; }
  .trow > div.r { justify-content: flex-end; }
  .tstars .st svg { width: clamp(22px, 3.6vh, 38px); }
  .tstars .st span { display: none; }
  .tpanel { display: flex !important; flex-direction: column; align-items: stretch !important; gap: .4vh !important; flex-wrap: nowrap !important; padding: .4vh .8vh; border-radius: 12px; background: linear-gradient(rgba(64, 41, 90, .92), rgba(36, 21, 58, .92)); border: 2px solid var(--deep); border-top: 4px solid var(--tc); box-shadow: 0 3px 0 rgba(0,0,0,.35); }
  .tpanel.blue { --tc: #4aa6ff; } .tpanel.red { --tc: #ff6060; }
  .tcount { font-size: clamp(12px, 1.8vh, 19px); font-weight: 800; text-shadow: var(--out); }
  .mini { position: relative; height: clamp(14px, 2.2vh, 24px); border-radius: 999px; overflow: hidden; background: #150a22; border: 2px solid var(--deep); }
  .mini .fill { left: 0; }
  .mini.fund .fill { background: linear-gradient(90deg, #d8961a, #ffe27a); }
  .mini.mor .fill { background: linear-gradient(90deg, #d0428a, #ff9ad0); }
  .mini.mor.on .fill { background: linear-gradient(90deg, #ffb020, #fff08a); }
  .mini span { position: absolute; inset: 0; display: grid; place-items: center; font-size: clamp(9px, 1.4vh, 14px); font-weight: 800; text-shadow: var(--out); z-index: 3; white-space: nowrap; }
  #tHint { text-align: center; margin-top: .8vh; font-size: clamp(11px, 1.7vh, 18px); opacity: .92; text-shadow: var(--out); }

  #guide { position: fixed; right: 2.5vw; bottom: 20vh; width: min(30vw, 320px); padding: .45em .8em; border-radius: 14px; font-size: clamp(11px, 1.8vh, 18px); line-height: 1.25; opacity: 0; transition: opacity .5s; pointer-events: none;
    background: linear-gradient(rgba(64, 41, 90, .92), rgba(36, 21, 58, .92)); border: 2px solid var(--rim); box-shadow: 0 3px 0 rgba(0,0,0,.4); text-shadow: var(--out); }
  #guide.show { opacity: 1; }
  #guide b { color: var(--gold); }
  #demoTag { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--safeBottom, 16vh) + 21vh); padding: .25em 1em; border-radius: 999px; font-size: clamp(11px, 1.8vh, 18px); font-weight: 800; white-space: nowrap; pointer-events: none;
    background: linear-gradient(rgba(64, 41, 90, .88), rgba(36, 21, 58, .88)); border: 2px solid var(--gold); color: var(--gold); text-shadow: var(--out); }
  .calm .fill::after, .calm .ev, .calm .st.on svg, .calm #tPhase.ot, .calm #tTimer.low, .calm #timer.low { animation: none !important; }
  .calm #banner.show { animation: bannerCalm 2.4s ease-out; }
  @keyframes bannerCalm { 0% { opacity: 0; } 10% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
  /* chữ nhỏ dùng viền mảnh để không bị dính và khó đọc */
  .tcount, .mini span, #tHint, #tugTxt, .st span, .badge, .ev .t div + div, #guide, #demoTag { text-shadow: var(--outs); }
  #tugTxt { margin-top: 1.1vh; }
  .mini { height: clamp(16px, 2.6vh, 26px); }
  .mini span { font-size: clamp(10px, 1.6vh, 15px); }
  .tcount { font-size: clamp(12px, 1.9vh, 20px); }
  #conn { position: fixed; left: 8px; bottom: 8px; padding: .2em .8em; border-radius: 8px; background: rgba(120, 20, 30, .9); font-size: 13px; }

  /* ---------- Khung dọc 9:16 (live điện thoại): chữ theo vw, tránh vùng giao diện TikTok ---------- */
  @media (max-aspect-ratio: 124/100) {
    #hud, #hudT { top: var(--safeTop, 9vh); width: min(94vw, 900px); }
    .meta { line-height: 1.15; }
    #lvl { font-size: 4.2vw; } #timer { font-size: 5.2vw; } #tScore { font-size: 3.4vw; } #tPhase { font-size: 3vw; }
    .bar { height: 7vw; } #pText { font-size: 3.8vw; }
    .st svg { width: 8vw; } .st span { font-size: 2.5vw; }
    .tb { height: 6.6vw; } .tb span { font-size: 3.4vw; }
    .tstars .st svg { width: 5.2vw; }
    .tcount { font-size: 3vw; } .mini { height: 3.2vw; } .mini span { font-size: 2.3vw; } #tHint { font-size: 2.6vw; } #tugTxt { font-size: 2.8vw; } #tug { height: 2.4vw; }
    .chip { font-size: 3.2vw; max-width: 44vw; } .badge { font-size: 3vw; }
    #feed { left: 2.5vw; width: 58vw; bottom: calc(var(--safeBottom, 16vh) + 1vh); }
    #demoTag { font-size: 2.8vw; }
    #guide { width: 36vw; bottom: calc(var(--safeBottom, 16vh) + 1vh); font-size: 2.6vw; }
    .ev { font-size: 3.3vw; }
    #banner { font-size: 11vw; top: 38vh; } #banner.small { font-size: 7vw; }
    #result h1 { font-size: 9vw; } #result h2 { font-size: 4vw; } #result .sub { font-size: 3.6vw; } #result p { font-size: 3.4vw; }
    #result ol { font-size: 3.6vw; width: 88vw; }
    #result .rs .st svg { width: 12vw; }
    .tcolr h3 { font-size: 4vw; } .tpct { font-size: 7vw; } .tcolr ol { font-size: 3vw !important; } .tcolr .rs .st svg { width: 8vw; } .tcolr .mv { font-size: 2.7vw; }
    #conn { font-size: 3vw; }
  }
  @media (min-aspect-ratio: 5/4) {
    #hud, #hudT { left: 2vw; transform: none; width: min(32vw, 560px); top: 2vh; }
    #feed { left: auto; right: 1.5vw; bottom: 5vh; width: min(21vw, 400px); }
    #demoTag { left: 2vw; transform: none; bottom: 10vh; }
    #guide { right: auto; left: 2vw; bottom: 3vh; width: min(30vw, 420px); }
  }
  @media (prefers-reduced-motion: reduce) { .ev, .st.on svg, #result, #banner.show, .fill::after, #tTimer.low, #timer.low, #tPhase.ot { animation: none; } }
</style>
<link rel="stylesheet" href="/assets/theme.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gStar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff4b0"/><stop offset=".5" stop-color="#ffcf4a"/><stop offset="1" stop-color="#e58a16"/></linearGradient>

      if (!b.dead && b.maxHp && b.hp / b.maxHp < .5) { b.smokeT -= dt; if (b.smokeT <= 0) { b.smokeT = .18; particles.push({ x: PX(b.x) + rand(-4, 4), y: PY(b.y) - b.radius * k * .5, vx: rand(-8, 8), vy: -rand(30, 60), life: 1.1, color: 'rgba(60,50,60,.5)', size: b.radius * k * .28, smoke: true }); } }

    for (let i = projectiles.length - 1; i >= 0; i--) {

      p.x = p.fx + (p.tx - p.fx) * q; p.y = p.fy + (p.ty - p.fy) * q - (p.kind === 'shell' ? Math.sin(Math.PI * q) * 9 : 0);
      if (p.kind === 'rocket') particles.push({ x: PX(p.x), y: PY(p.y), vx: rand(-10, 10), vy: rand(-10, 10), life: .4, color: 'rgba(230,230,230,.6)', size: k * .5, smoke: true });

  function jagged(x1, y1, x2, y2, seg, amp) {

    for (let q = 1; q < seg; q++) { const s = q / seg; ctx.lineTo(x1 + (x2 - x1) * s + rand(-amp, amp), y1 + (y2 - y1) * s + rand(-amp, amp)); }
    ctx.lineTo(x2, y2); ctx.stroke();
  }

  function drawDecals(dt) {

      const d = decals[i]; d.life -= dt; if (d.life <= 0) { decals.splice(i, 1); continue; }
      const a = Math.min(1, d.life / 2);
      ctx.globalAlpha = a * .8; ctx.fillStyle = '#2a1a18'; ell(d.x, d.y, d.r, d.r * .55); ctx.fill();
      ctx.globalAlpha = a * .55; ctx.strokeStyle = '#ff8a3d'; ctx.lineWidth = Math.max(2, d.r * .12); ell(d.x, d.y, d.r * .92, d.r * .5); ctx.stroke(); ctx.globalAlpha = 1;
    }
  }

  function drawFx(dt, t) {
    for (const m of meteors) { // quả cầu lửa đang rơi
      const q = Math.min(1, m.t / m.dur), x = m.x0 + (m.x - m.x0) * q, y = m.y0 + (m.y - m.y0) * q, R = k * 3.2;
      ctx.strokeStyle = lgr(m.x0, m.y0, x, y, [[0, 'rgba(255,120,40,0)'], [1, 'rgba(255,190,80,.9)']]); ctx.lineWidth = R * 1.2; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x - (x - m.x0) * .35, y - (y - m.y0) * .35); ctx.lineTo(x, y); ctx.stroke();

      ctx.fillStyle = '#5a3a30'; circle(x, y, R * .7); FS('#6a463a', 2);
    }
    for (const p of projectiles) {

      if (p.kind === 'arrow') { ctx.strokeStyle = '#efe6c8'; ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x - Math.cos(a) * 10, y - Math.sin(a) * 10); ctx.lineTo(x, y); ctx.stroke(); }
      else { ctx.fillStyle = p.kind === 'rocket' ? '#e05a4a' : '#20202a'; circle(x, y, Math.max(3, k * (p.kind === 'shell' ? .9 : .7))); ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.5; ctx.stroke(); }
    }
    for (let i = rings.length - 1; i >= 0; i--) {
      const r = rings[i]; r.life -= dt; if (r.life <= 0) { rings.splice(i, 1); continue; }
      const q = 1 - r.life / r.max; ctx.globalAlpha = r.life / r.max; ctx.strokeStyle = r.color; ctx.lineWidth = 5; circle(r.x, r.y, r.r0 + (r.r1 - r.r0) * q); ctx.stroke(); ctx.globalAlpha = 1;
    }
    for (let i = bolts.length - 1; i >= 0; i--) {

      ctx.strokeStyle = b.color; ctx.lineWidth = b.w; ctx.lineJoin = 'round'; ctx.shadowColor = b.color; ctx.shadowBlur = 14;
      jagged(b.x1, b.y1, b.x2, b.y2, b.sky ? 10 : 6, b.sky ? 22 : 9); ctx.shadowBlur = 0;
    }
    for (let i = particles.length - 1; i >= 0; i--) {

      ctx.lineWidth = 6; ctx.strokeStyle = '#2a0c0c'; ctx.strokeText(f.text, f.x, f.y); ctx.fillStyle = f.color || (f.big ? '#ffcf4a' : '#ff7a5c'); ctx.fillText(f.text, f.x, f.y); ctx.globalAlpha = 1;
    }
    const T1 = mode === 'solo' ? TS('atk') : null;
    if (T1 && T1.rg && T1.rg.l > 0) { ctx.fillStyle = rgr(W / 2, H / 2, Math.min(W, H) * .35, Math.max(W, H) * .75, [[0, 'rgba(181,108,255,0)'], [1, 'rgba(181,108,255,' + (.28 + .08 * Math.sin(t * .008)) + ')']]); ctx.fillRect(0, 0, W, H); }
    if (T1 && T1.fz > 0) { ctx.fillStyle = 'rgba(140,210,255,' + (.09 + .03 * Math.sin(t * .006)) + ')'; ctx.fillRect(0, 0, W, H); }
    if (hud.gd && mode === 'team' && status === 'playing') { ctx.fillStyle = rgr(W / 2, H / 2, Math.min(W, H) * .4, Math.max(W, H) * .8, [[0, 'rgba(255,200,60,0)'], [1, 'rgba(255,190,50,' + (.2 + .05 * Math.sin(t * .006)) + ')']]); ctx.fillRect(0, 0, W, H); }
    if (hud.ot && mode === 'team' && status === 'playing') { ctx.fillStyle = rgr(W / 2, H / 2, Math.min(W, H) * .35, Math.max(W, H) * .8, [[0, 'rgba(255,40,70,0)'], [1, 'rgba(255,40,70,' + (CALM ? .25 : .22 + .1 * Math.sin(t * .012)) + ')']]); ctx.fillRect(0, 0, W, H); }

  }

  /* ================== Sự kiện từ server ================== */
  const SRC = { like: 'Thả tim: ', follow: 'Theo dõi: ', share: 'Chia sẻ: ', chat: 'Chat: ' };
  function addFeed(nodeChildren, color, cls) {
    const e = el('div', 'ev' + (cls ? ' ' + cls : '')); e.style.setProperty('--c', color || '#ff8a3d');
    e.append(...nodeChildren);
    const feed = $('feed'); feed.append(e);
    while (feed.children.length > (W / H >= 1.25 ? 5 : 3)) feed.firstChild.remove();
    setTimeout(() => e.classList.add('out'), 6500); setTimeout(() => e.remove(), 7100);
  }
  let bannerT = null;
  function banner(text, cls, small) {
    const b = $('banner'); b.textContent = text; b.className = (cls === true ? 'boss' : (cls || '')) + (small ? ' small' : ''); void b.offsetWidth; b.classList.add('show');
    clearTimeout(bannerT); bannerT = setTimeout(() => b.classList.remove('show'), 2500);
  }
  const noteFeed = (title, sub, color, cls) => { const t = el('div', 't'); t.append(el('div', '', title)); if (sub) t.append(el('div', '', sub)); addFeed([t], color, cls || 'big'); };

    if (d.blocked) { sfx.shield(); ring(theirs.x, theirs.y, 20, 32 * k, .6, '#bfe8ff'); floaters.push({ x: theirs.x, y: theirs.y - k * 10, text: 'KHIÊN CHẶN!', life: 1.6, big: true, color: '#d8f4ff' }); return; }

    noteFeed((d.by || TU(d.team)) + ' hạ Rồng!', 'Đội ' + TN(d.team) + ' được ×' + d.mult + ' sát thương ' + d.buffSec + 's', TC(d.team));
  }
  function onGuardianLeft() { banner('RỒNG BAY ĐI, KHO BÁU BIẾN MẤT', '', true); noteFeed('Không ai hạ được Rồng', 'Kho báu đã biến mất', '#aaa'); }
  function onGolden(d) { sfx.drum(); setTimeout(() => sfx.drum(), 180); setTimeout(() => sfx.gold(), 360); shake = 12; banner('GIỜ VÀNG! SÁT THƯƠNG ×' + d.mult, ''); noteFeed('GIỜ VÀNG: sát thương ×' + d.mult, 'Tặng quà lúc này giá trị gấp đôi!', '#ffcf4a'); }
  function onLateRush() { sfx.boss(); shake = 10; banner('PHÒNG THỦ TĂNG CƯỜNG!', true, true); noteFeed('Phòng thủ tăng cường!', 'Tặng quà ngay để hạ căn cứ trước khi quá muộn', '#ff8a3d'); }
  function onOvertime(d) { sfx.boss(); shake = 18; banner('HIỆP PHỤ!', true); noteFeed('HÒA! Vào hiệp phụ ' + d.sec + ' giây', 'Đội nào phá được công trình trước sẽ thắng', '#ff4a5e'); }
  function onLeadChange(d) { sfx.drum(); shake = 8; banner(TU(d.team) + ' ĐẢO NGƯỢC TÌNH THẾ!', 't' + d.team, true); }
  function onCloseCall(d) { sfx.drum(); banner('CÂN SỨC! ' + (d.trailing ? TU(d.trailing) + ' SẮP LẬT KÈO' : 'HAI ĐỘI NGANG NHAU'), d.trailing ? 't' + d.trailing : '', true); }
  function onCatchUp(d) { noteFeed('Đội ' + TN(d.team) + ' đang bị bỏ xa', 'Nhận +' + Math.round(d.bonus * 100) + '% sát thương để bám đuổi', TC(d.team), ''); }
  function onBounty(d) { sfx.horn(); noteFeed('TRUY NÃ: ' + d.name, 'Đội ' + TN(d.against) + ' hạ lính của người này sẽ được thưởng quỹ', '#ff4a5e', 'kill'); }
  function onBountyClaimed(d) { sfx.coin(); noteFeed('Đội ' + TN(d.team) + ' hạ ' + d.count + ' lính bị truy nã', '+' + d.fund + ' quỹ đội (' + d.target + ')', TC(d.team), 'kill'); }
  function onSpellBlocked(d) { const c = baseCenter(d.target); sfx.shield(); ring(c.x, c.y, 20, 32 * k, .6, '#bfe8ff'); }

  function fillList(id, arr) {
    const ol = $(id); ol.replaceChildren();
    arr.forEach((p, i) => { const li = el('li'); const sp = el('span', '', (i + 1) + '. ' + p.name); if (p.color) sp.style.color = p.color; li.append(sp, el('b', '', fmt(p.dmg) + (p.kills ? '  (' + p.kills + ' phá)' : ''))); ol.append(li); });
  }
  function finishResult(d, win) {
    $('rAllBox').hidden = !d.allTime || !d.allTime.length; if (d.allTime) fillList('rAll', d.allTime);
    resultUntil = Date.now() + d.breakMs; $('result').hidden = false; status = 'ended';
    if (win) { sfx.win(); for (let i = 0; i < 70; i++) particles.push({ x: W / 2, y: H * .4, vx: rand(-320, 320), vy: rand(-520, -120), life: rand(1, 2), color: Math.random() < .5 ? '#ffcf4a' : '#ff8a3d', size: rand(4, 9), g: 600 }); } else sfx.lose();
  }
  function showResult(d) {
    if (d.mode === 'team') return showTeamResult(d);
    const win = d.result === 'win';
    $('rSeasonBox').hidden = true; $('rSolo').hidden = false; $('rTeams').hidden = true; $('rSubT').textContent = ''; $('rScore').textContent = d.demo ? 'Trận trình diễn: không tính vào cấp độ' : ''; $('rTitle').style.color = '';
    $('rTitle').textContent = win ? (d.boss ? 'Hạ gục Boss!' : 'Phá hủy hoàn toàn!') : 'Hết giờ!';
    const rs = $('rStars'); rs.replaceChildren(); starBox().forEach((s, i) => { if (d.stars[i]) s.classList.add('on'); rs.append(s); });
    $('rSub').textContent = 'Phá hủy ' + d.destruction + '%' + (d.thKiller ? '  -  Hạ Nhà Chính: ' + d.thKiller : '');
    fillList('rTop', d.top);
    finishResult(d, win);
  }
  function fillPts(id, arr) {
    const ol = $(id); ol.replaceChildren();
    arr.forEach((p, i) => { const li = el('li'); li.append(el('span', '', (i + 1) + '. ' + p.name), el('b', '', fmt(p.pts) + ' điểm')); ol.append(li); });
  }
  const REASONS = { annihilation: 'Phá hủy hoàn toàn căn cứ đối phương', suddendeath: 'Hiệp phụ: phá được công trình trước là thắng', overtime: 'Hòa cả sau hiệp phụ', timeup: 'Hết giờ: so sao trước, rồi tới % phá hủy' };
  function showTeamResult(d) {
    const w = d.winner;
    $('rSolo').hidden = true; const box = $('rTeams'); box.hidden = false; box.replaceChildren();
    $('rTitle').textContent = w === 'draw' ? 'HÒA!' : TU(w) + ' THẮNG!';
    $('rTitle').style.color = w === 'draw' ? '' : TC(w);
    $('rSubT').textContent = REASONS[d.reason] || REASONS.timeup;
    for (const t of ['blue', 'red']) {
      const x = d.teams[t], col = el('div', 'tcolr' + (t === w ? ' win' : '')); col.style.setProperty('--c', TC(t));
      const rs = el('div', 'rs'); starBox().forEach((s, i) => { if (x.stars[i]) s.classList.add('on'); rs.append(s); });
      const ol = el('ol'); x.top.forEach((p, i) => { const li = el('li'); const sp = el('span', '', (i + 1) + '. ' + p.name); if (p.color) sp.style.color = p.color; li.append(sp, el('b', '', fmt(p.dmg) + (p.frags ? '  (' + p.frags + ' hạ)' : ''))); ol.append(li); });
      col.append(el('h3', '', 'Đội ' + TN(t)), rs, el('div', 'tpct', x.p + '%'), ol);
      if (x.topPts) col.append(el('div', 'mv', 'Đại gia: ' + x.topPts.name + ' (' + fmt(x.topPts.pts) + ' điểm quà)'));
      box.append(col);
    }
    $('rSeasonBox').hidden = !d.seasonTop || !d.seasonTop.length; if (d.seasonTop) fillPts('rSeason', d.seasonTop);
    const sc = d.teamScore || teamScore; teamScore = sc;
    $('rScore').textContent = d.demo ? 'Trận trình diễn: không tính vào tỷ số mùa' : 'Tỷ số mùa: ' + TN('blue') + ' ' + sc.blue + ' - ' + sc.red + ' ' + TN('red') + (sc.draws ? '  (hòa ' + sc.draws + ')' : '');
    finishResult(d, w !== 'draw');
  }

  function applyRound(d) {
    mode = d.mode || 'solo'; arena = d.arena || arena; layoutGeom();
    level = d.level; boss = d.boss; modLabel = d.mod || ''; status = 'playing';
    teamScore = d.teamScore || teamScore; teamInfo = d.teams || teamInfo;
    $('hud').hidden = mode === 'team'; $('hudT').hidden = mode !== 'team'; $('feed').classList.toggle('team', mode === 'team');
    $('hud').classList.toggle('boss', !!boss); $('lvl').textContent = 'Cấp ' + level + (boss ? ' (Boss)' : '');
    const m = $('mod'); m.hidden = !modLabel; m.firstChild.textContent = modLabel;
    hud = { T: {}, tl: d.roundLen || 0, en: false, top: mode === 'team' ? { blue: [], red: [] } : [], bo: null, gd: false, ot: false, lr: false, phase: null, pl: 0 }; tlAt = performance.now();
    topLeaderId = null;
    setLayout(d.layout); $('top').dataset.k = ''; $('ttBlue').dataset.k = ''; $('ttRed').dataset.k = '';
    $('tHint').textContent = 'Chat !xanh / !do chọn đội · chat lại lệnh = hô hào';
    renderStars(); renderTop();
  }

  /* ================== Socket ================== */
  const socket = io();
  const setCfg = (d) => { cfg = { troops: d.troops, spells: d.spells || {}, buildings: d.buildings || {}, npcs: d.npcs || {}, gifts: d.gifts || cfg.gifts || {}, brand: d.brand || cfg.brand || {}, team: d.team || cfg.team }; };
  socket.on('connect', () => { $('conn').hidden = true; });
  socket.on('disconnect', () => { $('conn').hidden = false; });
  socket.on('init', (d) => {
    setCfg(d); (d.owners || []).forEach((o) => owners.set(o.i, o));
    applyRound(d); if (d.snap) applySnap(d.snap);
    if (d.status === 'ended') status = 'ended';
    $('demoTag').hidden = !d.demo;
    for (const t of ['atk', 'blue', 'red']) dispP[t] = TS(t).p;
  });
  socket.on('config', setCfg);
  socket.on('snap', applySnap);
  socket.on('spawn', onSpawn);
  socket.on('spell', onSpell);
  socket.on('join', onJoin);
  socket.on('teams', (d) => { teamInfo = d; });
  socket.on('bldDestroyed', onBldDestroyed);
  socket.on('star', onStar);
  socket.on('phase', () => { sfx.rage(); shake = 10; banner('CÔNG THÀNH!', ''); ring(PX(arena.w / 2), PY(arena.h / 2), 20, AWk * .7, .9, '#ffcf4a'); });
  socket.on('enrage', () => { sfx.boss(); shake = 14; banner('BOSS NỔI ĐIÊN!', true); const c = baseCenter('def'); ring(c.x, c.y, 20, AWk * .8, .9, '#ff4a5e'); });
  socket.on('unlock', onUnlock); socket.on('morale', onMorale); socket.on('guardian', onGuardian); socket.on('guardianDown', onGuardianDown); socket.on('guardianLeft', onGuardianLeft);
  socket.on('golden', onGolden); socket.on('lateRush', onLateRush); socket.on('overtime', onOvertime); socket.on('leadChange', onLeadChange); socket.on('closeCall', onCloseCall);
  socket.on('catchUp', onCatchUp); socket.on('bounty', onBounty); socket.on('bountyClaimed', onBountyClaimed); socket.on('spellBlocked', onSpellBlocked);
  socket.on('demo', (d) => { $('demoTag').hidden = !d.on; });
  socket.on('roundEnd', showResult);
  socket.on('roundStart', (d) => {
    $('result').hidden = true; resultUntil = 0; owners.clear(); applyRound(d);
    if (d.mode === 'team') banner('GIAO TRANH!', '');
    else { banner(d.boss ? 'BOSS - CẤP ' + d.level : 'CẤP ' + d.level, d.boss); if (d.boss) sfx.boss(); }
  });

  /* ===== Bảng hướng dẫn quà: luân phiên gợi ý để người mới vào phòng biết làm gì ===== */
  const guideEl = $('guide'); let guideI = 0;
  function guideTips() {
    const lbl = (k) => (cfg.troops[k] && cfg.troops[k].label) || (cfg.spells[k] && cfg.spells[k].label) || k, ents = Object.entries(cfg.gifts || {}), tips = [];
    for (let i = 0; i < ents.length; i += 3) tips.push('Tặng quà: ' + ents.slice(i, i + 3).map(([n, k]) => '*' + n + '* → ' + lbl(k)).join(' · '));
    if (mode === 'team') tips.push('Chat *!xanh* hoặc *!do* để vào đội', 'Chat lại lệnh đội của mình để *hô hào* nạp tinh thần', 'Quà nào cũng góp *Quỹ đội*: đầy quỹ mở Máy phá thành và Tướng', 'Tặng nhiều nhất đội sẽ bị *truy nã*: địch hạ lính bạn được thưởng');
    else tips.push('Thả tim, theo dõi, chia sẻ cũng gọi lính ra trận');
    if (cfg.brand && cfg.brand.text) tips.push((cfg.brand.name ? '*' + String(cfg.brand.name).replace(/\*/g, '') + '*: ' : '') + String(cfg.brand.text).replace(/\*/g, ''));
    return tips;
  }
  function showGuide() {
    if (status !== 'playing') { guideEl.classList.remove('show'); return; }
    const tips = guideTips(); if (!tips.length) return;
    const parts = tips[guideI++ % tips.length].split('*');
    guideEl.replaceChildren(...parts.map((s, i) => (i % 2 ? el('b', '', s) : el('span', '', s))));
    guideEl.classList.add('show'); setTimeout(() => guideEl.classList.remove('show'), 6000);
  }
  setInterval(showGuide, 9000); setTimeout(showGuide, 4000);

  /* ================== HUD + vòng lặp ================== */
  let timerText = '', tTimerText = '';
  const localLeft = (v) => Math.max(0, v - (performance.now() - tlAt) / 1000);
  const mmss = (left) => Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
  function setBadgeNode(b, show, text, frac) {
    b.hidden = !show; if (!show) return;
    if (b.firstChild.textContent !== text) b.firstChild.textContent = text;
    if (b.lastChild.tagName === 'I') b.lastChild.style.width = Math.max(0, Math.min(100, frac * 100)) + '%';
  }

  function updateHudSolo() {
    const T = TS('atk');
    $('pFill').style.width = dispP.atk + '%'; $('pGhost').style.width = T.p + '%';
    $('pText').textContent = 'Phá hủy ' + Math.floor(dispP.atk) + '%';
    const left = status === 'playing' ? Math.ceil(localLeft(hud.tl)) : 0, tx = mmss(left);
    if (tx !== timerText) { timerText = tx; $('timer').textContent = tx; $('timer').classList.toggle('low', left <= 15 && left > 0); }
    const on = status === 'playing', cb = T.cb, rg = T.rg;
    setBadgeNode($('combo'), on && cb && cb.n > 0 && localLeft(cb.l) > 0, cb ? 'Combo ' + cb.n + '  (+' + Math.round((cb.m - 1) * 100) + '% sát thương)' : '', cb ? localLeft(cb.l) / cb.w : 0);
    setBadgeNode($('rage'), on && rg && localLeft(rg.l) > 0, rg ? 'Cuồng nộ ×' + rg.m + '  ' + Math.ceil(localLeft(rg.l)) + 's' : '', rg ? localLeft(rg.l) / 15 : 0);
    setBadgeNode($('freeze'), on && localLeft(T.fz) > 0, 'Đóng băng phòng thủ  ' + Math.ceil(localLeft(T.fz)) + 's', localLeft(T.fz) / 8);
    $('enrage').hidden = !(on && hud.en);
    $('rush').hidden = !(on && hud.lr && !hud.en);
  }

  function updateHudTeam() {
    const left = status === 'playing' ? Math.ceil(localLeft(hud.tl)) : 0, tx = mmss(left), gold = !!(hud.gd && status === 'playing');
    if (tx !== tTimerText) { tTimerText = tx; $('tTimer').textContent = tx; }
    $('tTimer').classList.toggle('low', left <= 20 && left > 0 && !gold); $('tTimer').classList.toggle('gold', gold);
    sfx.speed(hud.gd || hud.ot ? 1.6 : 1);
    const ph = $('tPhase'); ph.className = ''; ph.style.color = '';
    if (status !== 'playing') ph.textContent = '';
    else if (hud.ot) { ph.textContent = 'HIỆP PHỤ: phá được công trình trước là thắng'; ph.classList.add('ot'); }
    else if (hud.gd) { ph.textContent = 'GIỜ VÀNG ×' + ((cfg.team.golden && cfg.team.golden.mult) || 2); ph.classList.add('golden'); }
    else if (hud.phase === 'clash') { ph.textContent = 'GIAO TRANH ' + Math.ceil(localLeft(hud.pl)) + 's'; ph.style.color = '#ffb347'; }
    else if (hud.phase) { ph.textContent = 'CÔNG THÀNH +' + Math.round(((cfg.team.siegeBonus || 1) - 1) * 100) + '%'; ph.style.color = '#ffcf4a'; }
    else ph.textContent = '';
    $('tScore').textContent = TN('blue') + ' ' + teamScore.blue + ' - ' + teamScore.red + ' ' + TN('red');
    // thanh kéo co: bên nào đang dẫn
    const diff = dispP.blue - dispP.red, ad = Math.abs(diff);
    $('tugMark').style.left = (50 + Math.max(-30, Math.min(30, diff)) / 30 * 46) + '%';
    const tt = $('tugTxt'); if (ad < 1.5) { tt.textContent = 'CÂN BẰNG'; tt.style.color = ''; } else { const lead = diff > 0 ? 'blue' : 'red'; tt.textContent = TU(lead) + ' DẪN ' + Math.round(ad) + '%'; tt.style.color = TC(lead); }
    const on = status === 'playing';
    for (const t of ['blue', 'red']) {
      const T = TS(t), B = t === 'blue' ? 'Blue' : 'Red';
      $('tf' + B).style.width = dispP[t] + '%';
      $('tp' + B).textContent = (t === 'blue' ? '■ ' : '▲ ') + TN(t).toUpperCase() + ' ' + Math.floor(dispP[t]) + '%';
      const hc = teamInfo.handicap && teamInfo.handicap[t] > 1.001 ? '  (+' + Math.round((teamInfo.handicap[t] - 1) * 100) + '% hỗ trợ)' : '';
      $('tc' + B).textContent = (teamInfo.counts ? teamInfo.counts[t] : 0) + ' người' + hc; $('tc' + B).style.color = TC(t);
      $('tu' + B).style.width = (T.fu || 0) + '%'; $('tuT' + B).textContent = 'QUỸ ĐỘI ' + (T.fu || 0) + '%' + (T.fl ? '  ·  mở ×' + T.fl : '');
      const mOn = on && T.mb > 0; $('tmW' + B).classList.toggle('on', mOn);
      $('tm' + B).style.width = (mOn ? Math.min(100, localLeft(T.mb) / ((cfg.team.cheer && cfg.team.cheer.buffSec) || 12) * 100) : (T.mo || 0)) + '%';
      $('tmT' + B).textContent = mOn ? 'HÔ HÀO ×' + ((cfg.team.cheer && cfg.team.cheer.buffMult) || 1.3) + '  ' + Math.ceil(localLeft(T.mb)) + 's' : 'TINH THẦN ' + (T.mo || 0) + '%';
      const cb = T.cb, rg = T.rg, bd = tBadge[t], en = enemyOf(t);
      setBadgeNode(bd.combo, on && cb && cb.n > 0 && localLeft(cb.l) > 0, cb ? 'Combo ' + cb.n + ' (+' + Math.round((cb.m - 1) * 100) + '%)' : '', cb ? localLeft(cb.l) / cb.w : 0);
      setBadgeNode(bd.rage, on && rg && localLeft(rg.l) > 0, rg ? 'Cuồng nộ ×' + rg.m + ' ' + Math.ceil(localLeft(rg.l)) + 's' : '', rg ? localLeft(rg.l) / 15 : 0);
      setBadgeNode(bd.fz, on && localLeft(T.fz) > 0, 'Đóng băng địch ' + Math.ceil(localLeft(T.fz)) + 's', localLeft(T.fz) / 8);
      setBadgeNode(bd.ps, on && localLeft(T.ps) > 0, 'Độc địch ' + Math.ceil(localLeft(T.ps)) + 's', localLeft(T.ps) / 10);
      setBadgeNode(bd.sh, on && localLeft(T.sh) > 0, 'Khiên ' + Math.ceil(localLeft(T.sh)) + 's', localLeft(T.sh) / 8);
      setBadgeNode(bd.bf, on && localLeft(T.bf) > 0, 'Buff Rồng ×' + ((cfg.team.guardian && cfg.team.guardian.buffMult) || 1.5) + ' ' + Math.ceil(localLeft(T.bf)) + 's', localLeft(T.bf) / 20);
      setBadgeNode(bd.mb, false, '', 0);
      setBadgeNode(bd.cu, on && T.cu, 'Bám đuổi +' + Math.round((((cfg.team.catchUp && cfg.team.catchUp.bonus) || .2)) * 100) + '%', 1);
    }
  }

  function updateHud() {
    for (const t of ['atk', 'blue', 'red']) dispP[t] += (TS(t).p - dispP[t]) * .12;
    if (resultUntil) $('rNext').textContent = 'Trận mới sau ' + Math.max(0, Math.ceil((resultUntil - Date.now()) / 1000)) + ' giây';
    if (mode === 'team') updateHudTeam(); else updateHudSolo();
  }

  let last = performance.now();
  function frame(t) {
    const dt = Math.min(.05, (t - last) / 1000); last = t;
    updateHud(); updateFx(dt, t);
    ctx.clearRect(0, 0, W, H);
    ctx.save(); if (shake > .5) ctx.translate(rand(-shake, shake) * .6, rand(-shake, shake) * .6);
    drawGround(t); drawAmbient(t); drawDecals(dt);
    if (mode === 'team' && hud.bo) drawChest(t);
    const units = [...umap.values()];
    const items = [...bmap.values()].map((b) => ({ y: b.y, b })).concat(units.map((u) => ({ y: u.y, u }))).concat(decor.filter((d) => d.t === 'tree' || d.t === 'rock').map((d) => ({ y: d.y, d })));
    items.sort((a, b) => a.y - b.y);
    for (const it of items) { if (it.b) drawBuilding(it.b, t); else if (it.u) drawUnit(it.u, t); else if (it.d.t === 'tree') drawTree(it.d, t); else drawRock(it.d); }
    drawShields(t); drawButterflies(t); drawBeams(t); drawTags(units); drawFx(dt, t);
    ctx.restore();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ===== Phím tắt thử (mở bằng trình duyệt trên máy chạy server) =====
     1 Archer  2 Barbarian  3 Hog Rider  4 Giant  5 Balloon  6 Electro Dragon
     7 Lightning  8 Freeze  9 Heal  0 Rage  Q Thiên thạch  W Độc  E Khiên  |  M: tắt/bật tiếng
     Solo: giữ Shift = gọi 5 cùng lúc. Chế độ đội: số = đội Xanh, Shift + số = đội Đỏ, giữ Alt = gọi 5 cùng lúc. */
  const KEYS = { 1: 'archer', 2: 'barbarian', 3: 'hogRider', 4: 'giant', 5: 'balloon', 6: 'electroDragon', 7: 'lightning', 8: 'freeze', 9: 'heal', 0: 'rage', q: 'meteor', w: 'poison', e: 'shield' };
  const SHIFT_DIGITS = { '!': '1', '@': '2', '#': '3', '$': '4', '%': '5', '^': '6', '&': '7', '*': '8', '(': '9', ')': '0' };
  window.addEventListener('keydown', (e) => {
    sfx.unlock();
    if (e.key === 'm' || e.key === 'M') { sfx.toggle(); return; }
    if (e.key === 'n' || e.key === 'N') { sfx.music(); return; }
    const lk = String(e.key).toLowerCase(), key = KEYS[e.key] ? e.key : (KEYS[lk] && /[qwe]/.test(lk) ? lk : SHIFT_DIGITS[e.key]); if (!key) return;
    const team = mode === 'team' ? (e.shiftKey ? 'red' : 'blue') : 'atk';
    const count = mode === 'team' ? (e.altKey ? 5 : 1) : (e.shiftKey && !/[qwe]/.test(key) ? 5 : 1);
    fetch('/sim?key=' + KEYS[key] + '&count=' + count + '&team=' + team).catch(() => {});
  });
})();
</script>
</body>
</html>
